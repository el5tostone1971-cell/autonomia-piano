function godPerformance(){const p=state.god.performance||{};const pct=v=>Number.isFinite(v)?Math.round(v):0;return `<div class="card"><div class="pill">MOTOR 03 · PERFORMANCE ENGINE</div><h2>¿Cómo tocaste, no solo qué tocaste?</h2><p class="muted">Analiza ejecución MIDI real: dinámica, duración, estabilidad temporal, simultaneidad, rango dinámico y pedal.</p><div class="godgrid"><div class="note-box"><b>Calidad global</b><div class="scorebig">${pct(p.score)||'—'}</div><span class="muted">/100</span></div><div class="note-box"><b>Dinámica</b><div class="scorebig">${pct(p.velocityConsistency)||'—'}</div><span class="muted">consistencia</span></div><div class="note-box"><b>Timing</b><div class="scorebig">${pct(p.timingConsistency)||'—'}</div><span class="muted">estabilidad</span></div><div class="note-box"><b>Duración</b><div class="scorebig">${pct(p.durationConsistency)||'—'}</div><span class="muted">control</span></div></div><div class="two"><div class="note-box"><b>Rango dinámico</b><p class="muted">${p.dynamicsRange||0} niveles MIDI · balance estimado ${pct(p.balance)}%</p></div><div class="note-box"><b>Acordes / pedal</b><p class="muted">Simultaneidad: ${pct(p.chordTightness)||'—'}% · Pedal: ${p.pedal?'detectado':'sin uso reciente'}</p></div></div><button class="btn primary" onclick="analyzePerformance()">Analizar ejecución real</button> <button class="btn" onclick="resetMidiTelemetry();openGodFeature('03')">Nueva medición</button><div class="note-box" style="margin-top:12px"><b>Últimas mediciones</b><p class="muted">${(p.sessions||[]).slice(-5).reverse().map(x=>`${x.date} · ${x.score}/100 · dinámica ${x.velocityConsistency}% · timing ${x.timingConsistency}%`).join('<br>')||'Todavía no hay mediciones.'}</p></div></div>`}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function stdev(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))}
function analyzePerformance(){const t=midiTelemetry,ons=t.eventsOn||[],offs=t.eventsOff||[];if(!t.notes||ons.length<3){toast('Tocá al menos 3 notas por MIDI y volvé a analizar.');return}const velocities=ons.map(x=>x.velocity),durations=offs.map(x=>x.duration).filter(x=>x>10&&x<10000),intervals=[];for(let i=1;i<ons.length;i++)intervals.push(ons[i].time-ons[i-1].time);const intervalCV=stdev(intervals)/(mean(intervals)||1),velCV=stdev(velocities)/(mean(velocities)||1),durCV=durations.length?stdev(durations)/(mean(durations)||1):1;const timingConsistency=Math.max(0,Math.min(100,100-intervalCV*120)),velocityConsistency=Math.max(0,Math.min(100,100-velCV*100)),durationConsistency=Math.max(0,Math.min(100,100-durCV*100)),dynamicsRange=Math.max(...velocities)-Math.min(...velocities);const groups=[];for(const e of ons){let g=groups.find(a=>Math.abs(a.t-e.time)<45);if(!g){g={t:e.time,notes:[]};groups.push(g)}g.notes.push(e.note)}const chords=groups.filter(g=>g.notes.length>=2);let chordTightness=100;if(chords.length){const spreads=chords.map(g=>Math.max(...g.notes)-Math.min(...g.notes));chordTightness=Math.max(0,Math.min(100,100-mean(spreads)*1.2))}const lows=ons.filter(x=>x.note<60).map(x=>x.velocity),highs=ons.filter(x=>x.note>=60).map(x=>x.velocity);const balance=lows.length&&highs.length?Math.max(0,Math.min(100,50+(mean(highs)-mean(lows)*1)*.6)):50;const score=Math.round(velocityConsistency*.25+durationConsistency*.2+timingConsistency*.3+chordTightness*.1+Math.min(100,dynamicsRange/70*100)*.15);state.god.performance=Object.assign(state.god.performance,{velocity:Math.round(mean(velocities)),duration:durations.length?Math.round(mean(durations)):0,timing:Math.round(timingConsistency),pedal:t.pedal,velocityConsistency:Math.round(velocityConsistency),durationConsistency:Math.round(durationConsistency),timingConsistency:Math.round(timingConsistency),chordTightness:Math.round(chordTightness),dynamicsRange,balance:Math.round(balance),score,sessions:[...(state.god.performance.sessions||[]),{date:new Date().toLocaleString('es-AR'),score,velocityConsistency:Math.round(velocityConsistency),timingConsistency:Math.round(timingConsistency)}].slice(-30)});state.diagnostics.counts=state.diagnostics.counts||{};state.diagnostics.counts.performance=(state.diagnostics.counts.performance||0)+1;saveState();toast('✓ Ejecución analizada: '+score+'/100');openGodFeature('03')}

function entryDiagRecord(n){if(!entryDiagActive)return false;const t=ENTRY_TASKS[entryDiagTask];if(!t)return false;const now=performance.now();entryDiagInput.push(n);entryDiagTimes.push(now);if(t.mode==='notes'&&entryDiagInput.length>=t.expected.length)return finishEntryTask();if(t.mode==='sequence'&&entryDiagInput.length>=t.expected.length)return finishEntryTask();if(t.mode==='chord'){const uniq=[...new Set(entryDiagInput)];if(uniq.length>=t.expected.length)return finishEntryTask()}if(t.mode==='rhythm'&&entryDiagInput.length>=4)return finishEntryTask();if(t.mode==='timed'&&entryDiagInput.length>=t.expected.length)return finishEntryTask();return true}
function finishEntryTask(){const t=ENTRY_TASKS[entryDiagTask],input=entryDiagInput.slice(),times=entryDiagTimes.slice();let score=0;if(t.mode==='rhythm'){const ints=times.slice(1).map((x,i)=>x-times[i]);const err=ints.reduce((a,x)=>a+Math.abs(x-500),0)/Math.max(1,ints.length);score=Math.max(0,Math.round(100-err/4));}else if(t.mode==='chord'){const got=new Set(input),hit=t.expected.filter(n=>got.has(n)).length;score=Math.round(hit/t.expected.length*100);}else{const hits=t.expected.reduce((a,n,i)=>a+(input[i]===n?1:0),0);score=Math.round(hits/t.expected.length*100);if(t.mode==='timed'&&times.length>1){const ints=times.slice(1).map((x,i)=>x-times[i]);const drift=ints.reduce((a,x)=>a+Math.abs(x-500),0)/Math.max(1,ints.length);score=Math.round(score*.65+Math.max(0,100-drift/4)*.35)}}const results=state.god.diagnostic.results||[];results.push({id:t.id,score,input,times:times.map(x=>Math.round(x)),at:new Date().toISOString()});state.god.diagnostic.results=results;entryDiagInput=[];entryDiagTimes=[];if(entryDiagTask<ENTRY_TASKS.length-1){entryDiagTask++;saveState();openGodFeature('04');if(ENTRY_TASKS[entryDiagTask].id==='ear')ENTRY_TASKS[entryDiagTask].expected.forEach((n,i)=>setTimeout(()=>tone(n),i*420));return true}return finishEntryDiagnostic()}

  ['T05','Notas guía','Do central y Sol de la segunda línea son referencias que ayudan a orientarse. Las usamos para encontrar otras notas por pasos.','Una referencia estable reduce la memorización mecánica.',0,'¿Para qué sirve una nota guía?',['Para cambiar el tempo','Para orientar la lectura','Para tocar más fuerte','Para marcar el pedal'],1],
  ['T06','Subir y bajar','Moverse hacia arriba en el pentagrama significa subir en altura; moverse hacia abajo significa bajar. Esto conecta la lectura visual con el teclado.','Arriba = más agudo; abajo = más grave.',0,'En el pentagrama, subir normalmente significa…',['Bajar de altura','Subir de altura','Cambiar compás','Cambiar volumen'],1],

 {id:2,title:'Ritmo y tiempo',lessons:[

  ['T10','Figuras rítmicas','Las figuras representan duraciones. Una negra puede funcionar como una unidad de pulso en muchos ejercicios, pero el valor depende del compás y del tempo.','Duración y pulso están relacionados, pero no son lo mismo.',1,'¿Qué representa una figura rítmica?',['Una altura','Una duración','Una digitación','Una tonalidad'],1],

  ['T13','Barras y acentos','Las barras de compás separan grupos. El primer pulso suele sentirse como referencia fuerte, aunque la música puede desplazar los acentos.','La barra organiza; el acento da sensación de jerarquía.',1,'¿Qué separa una barra de compás?',['Notas iguales','Grupos métricos','Claves','Octavas'],1],
  ['T14','Puntillo','Un puntillo agrega la mitad del valor de una figura a su duración original. Una negra con puntillo dura una negra más una corchea.','Puntillo = valor original + la mitad.',1,'¿Qué agrega un puntillo?',['El doble','La mitad del valor original','Una negra fija','Un silencio'],1],
  ['T15','Ligadura','Una ligadura de prolongación une duraciones de la misma altura. No significa volver a atacar la nota: significa sostenerla más tiempo.','Ligadura de prolongación = sumar duraciones.',1,'¿Qué hace una ligadura de prolongación?',['Repite el ataque','Suma duraciones','Cambia la altura','Cambia el compás'],1],

 {id:3,title:'Tonos, semitonos y escalas',lessons:[

  ['T18','Sostenido, bemol y becuadro','El sostenido sube una nota un semitono, el bemol la baja un semitono y el becuadro cancela una alteración previa.','♯ sube; ♭ baja; ♮ cancela.',2,'¿Qué hace un bemol?',['Sube un semitono','Baja un semitono','Duplica la duración','Cambia el compás'],1],
  ['T19','Escala mayor','Una escala mayor sigue un patrón de tonos y semitonos: T–T–S–T–T–T–S. Ese patrón genera su carácter y organiza sus grados.','Mayor: 2–2–1–2–2–2–1 semitonos.',2,'¿Cuál es el patrón de la escala mayor?',['T-T-S-T-T-T-S','T-S-T-T-S-T-T','S-S-T-T-T-S-T','T-T-T-T-S-S-S'],0],
  ['T20','Grados de la escala','Cada nota de una escala tiene un grado. El primero es la tónica, el quinto suele funcionar como dominante y el séptimo puede crear tensión hacia la tónica.','I = tónica; V = dominante.',2,'¿Qué grado es la tónica?',['I','II','V','VII'],0],
  ['T21','Tonalidad','La tonalidad define un centro de gravedad musical. Una pieza en Do mayor no es solo una colección de notas: Do funciona como referencia de reposo.','Tonalidad = centro + organización de alturas.',2,'¿Qué define principalmente una tonalidad?',['El instrumento','El centro tonal','La velocidad','El volumen'],1],
  ['T22','Armadura','La armadura reúne sostenidos o bemoles que afectan de manera estable a una tonalidad, salvo que aparezcan alteraciones accidentales.','La armadura prepara el mapa tonal.',2,'¿Para qué sirve la armadura?',['Indicar el tempo','Establecer alteraciones habituales','Indicar digitación','Marcar silencios'],1]
 ]},
 {id:4,title:'Intervalos',lessons:[
  ['T23','Qué es un intervalo','Un intervalo mide la distancia entre dos alturas. Se puede pensar como distancia en nombres de notas y también como cantidad de semitonos.','Intervalo = relación de distancia entre dos notas.',3,'¿Qué mide un intervalo?',['Duración','Distancia entre alturas','Volumen','Tempo'],1],
  ['T24','Segundas y terceras','Una segunda abarca dos nombres de nota consecutivos; una tercera abarca tres. La lectura por intervalos permite reconocer formas en vez de contar cada nota.','Segunda = 2 nombres; tercera = 3.',3,'¿Cuántos nombres de nota abarca una tercera?',['2','3','4','5'],1],
  ['T25','Cuartas y quintas','Cuarta y quinta son relaciones muy frecuentes en melodía y armonía. Reconocerlas visualmente ayuda a anticipar el movimiento.','Cuarta = 4 nombres; quinta = 5.',3,'¿Cuántos nombres abarca una quinta?',['3','4','5','6'],2],

 ]},
 {id:5,title:'Armonía funcional',lessons:[
  ['T29','Qué es un acorde','Un acorde combina varias alturas simultáneas. En la práctica, el oído reconoce su color y la teoría explica su estructura y función.','Acorde = varias notas simultáneas organizadas.',4,'¿Qué es un acorde?',['Una sola nota','Varias alturas simultáneas','Solo un ritmo','Una clave'],1],
  ['T30','Tríadas','Una tríada básica tiene tres notas separadas por intervalos de tercera. La nota inferior en posición fundamental es la raíz.','Tríada = raíz + tercera + quinta.',4,'¿Cuántas notas tiene una tríada básica?',['2','3','4','5'],1],
  ['T31','Mayor y menor','Las tríadas mayor y menor comparten raíz y quinta, pero cambia la tercera. Esa tercera determina gran parte del color mayor/menor.','Mayor: tercera mayor; menor: tercera menor.',4,'¿Qué nota diferencia principalmente mayor de menor?',['La raíz','La tercera','La quinta','La octava'],1],

  ['T34','Séptima dominante','El acorde V7 agrega una séptima al dominante y aumenta su tensión hacia I. Es una herramienta central del acompañamiento tonal.','V7 intensifica la resolución hacia I.',4,'¿Qué función tiene V7 respecto de I?',['Reposo absoluto','Tensión y resolución','Cambio de tempo','Silencio'],1]
 ]},
 {id:6,title:'Lectura autónoma',lessons:[
  ['T35','Frases musicales','Una frase musical es una unidad con dirección y sensación de llegada. No leemos solo símbolos: buscamos sentido, respiración y estructura.','La frase tiene dirección, tensión y llegada.',5,'¿Qué buscamos en una frase?',['Solo notas aisladas','Dirección y llegada','Solo digitación','Solo volumen'],1],

  ['T39','Preparación para repertorio','Antes de tocar una pieza completa identificamos tonalidad, compás, patrones, frases y dificultades. Así la práctica deja de ser ensayo ciego.','Analizar antes de ejecutar ahorra repeticiones inútiles.',5,'¿Qué conviene analizar antes de repertorio?',['Solo la primera nota','Tonalidad, compás, patrones y frases','Solo el título','Solo el pedal'],1],
  ['T40','Examen de autonomía','Última comprobación: usar teoría sin depender de una explicación paso a paso. Si aparece una dificultad, sabemos qué concepto revisar.','Autonomía = saber ejecutar y saber diagnosticar.',5,'¿Qué define mejor la autonomía?',['No cometer errores','Saber diagnosticar y corregir','No estudiar teoría','Tocar siempre rápido'],1]
 ]}

function theoryDone(id){return !!state.theory?.completed?.[id]}
function theoryPct(){return Math.round(THEORY_LESSONS.filter(x=>theoryDone(x.id)).length/THEORY_LESSONS.length*100)}
function missingTheory(view){return (THEORY_GATE[view]||[]).filter(id=>!theoryDone(id))}
function theoryGate(view){const ids=missingTheory(view);if(!ids.length)return false;const names=ids.map(id=>THEORY_LESSONS.find(x=>x.id===id)?.title||id);showHTML(shell('🎓 Primero entendamos esto','Este ejercicio necesita conceptos que todavía no demostraste.',`<div class="note-box"><b>Antes de entrar en ${view==='reading'?'Lectura':view==='rhythmReading'?'Ritmo':view==='phrases'?'Frases':view==='repertoire'?'Repertorio':view==='accompaniment'?'Acompañamiento':'esta práctica'} necesitás:</b><ol>${names.slice(0,8).map(n=>`<li>${n}</li>`).join('')}</ol><p class="muted">No es un bloqueo arbitrario: primero aprendés el concepto, después lo aplicás.</p><button class="btn primary" onclick="show('theory')">🎓 Ir a Teoría musical</button></div>`));return true}
function theoryView(){const done=THEORY_LESSONS.filter(x=>theoryDone(x.id)).length;const levels=THEORY_LEVELS.map(l=>{const d=l.lessons.filter(x=>theoryDone(x[0])).length;return `<div class="note-box"><div style="display:flex;justify-content:space-between;gap:10px"><b>Nivel ${l.id} · ${l.title}</b><span>${d}/${l.lessons.length}</span></div><div class="meter"><i style="width:${Math.round(d/l.lessons.length*100)}%"></i></div><div class="chips">${l.lessons.map(a=>{const ok=theoryDone(a[0]);return `<button class="btn small ${ok?'good':''}" onclick="openTheory('${a[0]}')">${ok?'✓ ':''}${a[0]} · ${a[1]}</button>`}).join('')}</div></div>`}).join('');return shell('🎓 Academia de Teoría Musical','Teoría → ejemplo → práctica → ejercicio → repaso → autonomía.',`<div class="stats"><div class="stat"><strong>${done}/40</strong><span class="muted">lecciones</span></div><div class="stat"><strong>${theoryPct()}%</strong><span class="muted">dominio teórico</span></div><div class="stat"><strong>${state.theory?.xp||0}</strong><span class="muted">XP teoría</span></div></div><div class="barline"><span>Progreso global</span><div class="meter"><i style="width:${theoryPct()}%"></i></div><b>${theoryPct()}%</b></div>${levels}`)}
function openTheory(id){const l=THEORY_LESSONS.find(x=>x.id===id);if(!l)return;showHTML(shell(`🎓 ${l.id} · ${l.title}`,'Aprendé el concepto antes de aplicarlo.',`<div class="note-box"><h3>Explicación</h3><p>${l.text}</p><div class="note-box"><b>Regla clave</b><p>${l.rule}</p></div></div><div class="note-box"><b>Comprobación</b><p>${l.question}</p><div class="chips">${l.options.map((o,i)=>`<button class="btn" type="button" onclick="answerTheory('${l.id}',${i})">${o}</button>`).join('')}</div><div id="theoryFeedback" class="feedback" style="margin-top:12px"></div></div>`))}
function answerTheory(id,i){const l=THEORY_LESSONS.find(x=>x.id===id);const f=document.getElementById('theoryFeedback');if(!l||!f)return;if(i!==l.correct){f.textContent='Todavía no. Volvé a mirar la explicación y probá de nuevo.';f.className='feedback bad';return}const first=!theoryDone(id);state.theory.completed[id]=true;if(first){state.theory.xp=(state.theory.xp||0)+10;state.xp+=10}saveState();f.textContent=first?'✓ Correcto. Concepto incorporado · +10 XP':'✓ Correcto. Concepto ya incorporado.';f.className='feedback good';setTimeout(()=>show('theory'),500)}
function theoryBootstrap(){if(!state.theory||typeof state.theory!=='object')state.theory={completed:{},xp:0};if(!state.theory.completed)state.theory.completed={}}

function curriculumForDay(d){const phase=d<=15?1:d<=45?2:d<=70?3:4;const sets={1:[['Geografía del teclado','Encontrar notas por patrones de teclas negras.'],['Técnica básica','Dedos relajados, muñeca estable y movimientos mínimos.'],['Pulso','Metrónomo y ataques regulares.'],['Oído','Escuchar, cantar y reproducir intervalos simples.']],2:[['Manos separadas','Bloques de 2–4 compases por mano.'],['Memoria','Retirar ayudas visuales gradualmente.'],['Coordinación','Unir manos después de consolidarlas por separado.'],['Lectura','Reconocer patrones sin depender de barras descendentes.']],3:[['Cifrado americano','Leer C, G, Am, F y sus funciones básicas.'],['Acompañamiento','Mano izquierda dirige el Style; derecha toca melodía.'],['Cambios','Cambios de acorde con pulso continuo.'],['Oído armónico','Identificar mayor/menor y progresiones frecuentes.']],4:[['Memoria','Canciones completas sin caída de notas.'],['Oído','Reproducir frases después de escucharlas.'],['Cifrado','Tocar desde una hoja de acordes.'],['Autonomía','Resolver errores sin instrucciones nota por nota.']]};const a=sets[phase];return a[(d-1)%a.length]}
function course(){let rows='';for(let d=1;d<=90;d++){const l=LESSONS.find(x=>x.day===d),p=PHASES.find(x=>d>=x.from&&d<=x.to),done=!!state.lessons[l.id],locked=d>state.day;rows+=`<div class="day ${!locked?'day-open':''}"><div style="flex:1"><b>Día ${d} · ${p.name.replace('Fase '+(PHASES.indexOf(p)+1)+' · ','')}</b><div>${l.title}</div><div class="muted">${l.desc}</div></div><div style="display:flex;align-items:center;gap:8px">${!locked?`<button class="btn ${done?'good':'primary'} small" type="button" onclick="openLesson('${l.id}')">${done?'↻ Revisar':'▶ Entrenar'}</button>`:''}<span class="status ${done?'done':''} ${locked?'lock':''}">${done?'✓ completado':locked?'🔒 progresivo':'listo para entrenar'}</span></div></div>`}return shell('Curso de 90 días','Los 90 días tienen un ejercicio concreto. El siguiente se desbloquea al demostrar el anterior. Si el diagnóstico detecta una debilidad repetida, la ruta adaptativa te propone un refuerzo sin quitarte el avance.',adaptiveCard()+`<div>${rows}</div>`)}

function staffY(note){
 const y={C4:112,D4:104,E4:96,F4:88,G4:80,A4:72,B4:64,C5:56,D5:48,E5:40,F5:32,G5:24}[note];
 return y??96;

function staffSvg(notes){
 const seq=Array.isArray(notes)?notes:[notes];
 const xs=seq.length===1?[250]:seq.map((_,i)=>210+i*125);
 const ledgerLines=[];
 seq.forEach((note,i)=>{if(note==='C4')ledgerLines.push(`<line x1="${xs[i]-42}" y1="112" x2="${xs[i]+42}" y2="112" class="ledger"/>`)});
 const heads=seq.map((note,i)=>{const y=staffY(note),x=xs[i];return `<ellipse cx="${x}" cy="${y}" rx="10" ry="7" class="staffnote" transform="rotate(-18 ${x} ${y})"/><line x1="${x+9}" y1="${y-3}" x2="${x+9}" y2="${y-42}" class="stem"/>`}).join('');
 return `<svg viewBox="0 0 700 150" class="staff" aria-label="Pentagrama en clave de sol"><g class="stafflines">${[32,48,64,80,96].map(v=>`<line x1="110" y1="${v}" x2="660" y2="${v}"/>`).join('')}</g><text x="125" y="92" class="clef">𝄞</text>${ledgerLines.join('')}${heads}</svg>`
}

function resetMidiTelemetry(){midiTelemetry={notes:0,velocitySum:0,velocityMax:0,lastVelocity:0,active:new Map(),durations:[],lastOn:null,lastOff:null,channel:null,pedal:0,eventsOn:[],eventsOff:[]};show('midiStudio');toast('Medición MIDI reiniciada')}
function midiNoteOn(note,vel,channel){const now=performance.now();midiTelemetry.notes++;midiTelemetry.velocitySum+=vel;midiTelemetry.velocityMax=Math.max(midiTelemetry.velocityMax,vel);midiTelemetry.lastVelocity=vel;midiTelemetry.channel=channel;midiTelemetry.active.set(note,{time:now,velocity:vel});midiTelemetry.lastOn={note,time:now,velocity:vel};midiTelemetry.eventsOn.push({note,time:now,velocity:vel});if(midiTelemetry.eventsOn.length>500)midiTelemetry.eventsOn.shift();}

function registerTechniqueNote(n){if(!techniqueStarted||techniqueStep>=techniqueExercise.notes.length)return;const expected=techniqueExercise.notes[techniqueStep];if(n!==expected){techniqueWrong++;diagnose('technique',`Error de digitación en ${techniqueExercise.title}. Volvé a la posición y repetí más lento.` ,techniqueExercise.hand==='Izquierda'?'left':'right');techniqueStep=0;techniqueTimes=[];const m=document.getElementById('techniqueMsg');if(m)m.innerHTML='❌ Nota fuera de la secuencia. Reiniciamos para consolidar la digitación.';const c=document.getElementById('techniqueCount');if(c)c.textContent=`0 / ${techniqueExercise.notes.length} notas`;return}techniqueTimes.push(performance.now());techniqueStep++;const m=document.getElementById('techniqueMsg');if(m)m.innerHTML=techniqueStep<techniqueExercise.notes.length?`Próxima nota: <b>${NOTE_NAMES[techniqueExercise.notes[techniqueStep]%12]}</b> · dedo <b>${techniqueExercise.fingers[techniqueStep]}</b>`:'✓ Secuencia completa. Comprobá la técnica.';const c=document.getElementById('techniqueCount');if(c)c.textContent=`${techniqueStep} / ${techniqueExercise.notes.length} notas`}

}

function parseMusicXML(text){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw Error('XML inválido');const noteNodes=[...xml.getElementsByTagName('note')];const notes=noteNodes.map(n=>{const p=n.getElementsByTagName('pitch')[0];if(!p)return null;const st=p.getElementsByTagName('step')[0]?.textContent||'C',oct=+(p.getElementsByTagName('octave')[0]?.textContent||4),alt=+(p.getElementsByTagName('alter')[0]?.textContent||0),idx=['C','D','E','F','G','A','B'].indexOf(st);if(idx<0)return null;return {midi:12*(oct+1)+[0,2,4,5,7,9,11][idx]+alt,step:st,alter:alt,octave:oct,duration:+(n.getElementsByTagName('duration')[0]?.textContent||0),voice:n.getElementsByTagName('voice')[0]?.textContent||'1'};}).filter(Boolean);const measures=[...xml.getElementsByTagName('measure')].map(x=>x.getAttribute('number')).filter(Boolean);return {notes:notes.length,measures:new Set(measures).size,level:notes.length<80?'Inicial':notes.length<250?'Intermedio':'Avanzado',sequence:notes.slice(0,128),at:new Date().toISOString()};}

function godMicro(){const c=state.diagnostics?.counts||{};const perf=state.god.performance||{};let lesson,why;if((c.late||0)>=2){lesson='Pulso: bajá 20 BPM. Marcá 1–2–3–4 antes de tocar y buscá cuatro ataques iguales.';why='Detecté repetición de errores de timing.'}else if((c.note||0)>=2){lesson='Precisión: aislá 2–4 notas. Repetí tres veces limpio y recién después agregá el siguiente bloque.';why='Detecté repetición de errores de notas.'}else if((c.technique||0)>=2){lesson='Técnica: dedos cerca de las teclas, muñeca libre y menos fuerza. La velocidad viene después.';why='Detecté repetición de errores técnicos.'}else if(perf.timingConsistency&&perf.timingConsistency<70){lesson='Estabilidad: tocá una frase corta con metrónomo y escuchá la distancia entre ataques, no solo las notas.';why='Tu última medición muestra timing inestable.'}else{lesson='Autonomía: memorizá un bloque de 4 compases, alejás la vista y resolvé el pasaje sin instrucciones nota por nota.';why='No hay una debilidad dominante; el siguiente paso es retirar ayuda.'}return `<div class="card"><div class="pill">MOTOR 09 · MICROLESSON</div><h2>Intervención justo a tiempo</h2><div class="micro"><b>${why}</b><p>${lesson}</p></div><p class="muted">Duración objetivo: 30–120 segundos. Corrige el concepto y te devuelve al instrumento.</p><button class="btn primary" onclick="markMicroSeen()">✓ Entendido · volver a practicar</button></div>`}

function autonomyHelpForLesson(l){const mode=autonomyMode();const score=autonomyScore();const help=mode==='guide'?100:mode==='reduced'?65:mode==='memory'?35:10;state.god.autonomy={mode,helpLevel:help,lastScore:score,lastAt:new Date().toISOString(),history:[...(state.god.autonomy?.history||[]),{score,mode,help,date:new Date().toISOString()}].slice(-50)};if(mode==='guide')return {mode,show:true,label:'Guía completa'};if(mode==='reduced')return {mode,show:!l.hide,label:'Ayuda reducida'};return {mode,show:false,label:mode==='memory'?'Modo memoria':'Modo autonomía'};}

function genericLesson(l){resetExercise();patternExpected=l.seq.slice();const ah=autonomyHelpForLesson(l),showTarget=ah.show,midiSeq=l.seq.map(x=>60+NOTE_NAMES.indexOf(x));showHTML(shell('🎯 '+l.title,l.desc,`<div class="note-box"><b>Frase de práctica</b><div class="target ${showTarget?'':'hidden'}" id="genericTarget">${l.seq.join(' · ')}</div><button class="btn" type="button" onclick="toggleGenericHelp()">👁 Mostrar/ocultar ayuda</button> <button class="btn" type="button" onclick="playSeq(${JSON.stringify(midiSeq)})">▶ Escuchar</button><p class="muted">${ah.label}. La ayuda se retira a medida que ganás autonomía.</p></div>${keyboard()}<div class="note-box"><div id="genericInput" class="target" style="font-size:24px">—</div><div class="row-controls"><button class="btn" type="button" onclick="undoSequence()">⌫ Borrar última</button><button class="btn" type="button" onclick="clearSequence()">× Borrar todo</button><button class="btn good" type="button" onclick="checkGeneric('${l.id}')">Comprobar</button></div></div>`));}
function show(v){clearTimeout(window._nextTimer);currentLessonId=null;const rb=document.getElementById('retryBtn');if(rb)rb.style.display='none';navActive(v);theoryBootstrap();if(v!=='theory'&&theoryGate(v))return;const views={home:home,course:course,practice:practice,reading:reading,theory:theoryView,rhythmReading:rhythmReading,twoHands:twoHands,phrases:phrases,technique:technique,midiStudio:midiStudio,repertoire:repertoire,ear:ear,earAdvanced:earAdvanced,accompaniment:accompaniment,progress:progress,teacher:teacher,settings:settings,resources:resources,spaced:spacedView};if(views[v])showHTML(views[v]());else showHTML(shell('Sección no disponible','Esta sección todavía no está disponible en esta versión.','<div class="note-box">Podés volver a Inicio y continuar con el curso.</div>'))}
function advancedSystemView(){const feats=[['01','Modo Cirugía','Bloques, manos, tempo y errores reales.','ok'],['02','PRS / Piano Reading Score','Lectura a primera vista evaluada desde ejecución.','ok'],['03','Performance Engine','Dinámica, duración, timing, acordes y pedal MIDI.','ok'],['04','Diagnóstico Inicial','8 pruebas reales para ubicar el punto de partida.','ok'],['05','Repetición Espaciada','Revisión adaptativa 1–2–4–7–14–30 días.','ok'],['06','Music Engine','MIDI/MusicXML estructurados; PDF queda en cola OCR.','wip'],['07','Biblioteca inteligente','Búsqueda y filtro por nivel/objetivo/fuente.','ok'],['08','Sync / Backup','Exportación e importación completa del perfil.','wip'],['09','Microlecciones','Correcciones breves disparadas por datos reales.','ok'],['10','PWA','Instalable como PWA con HTTPS/localhost.','wip'],['11','Autonomy Engine','Retira ayuda según competencias.','ok']];return shell('⚙️ Sistema avanzado','Motores pedagógicos y técnicos internos. Los detalles de infraestructura no forman parte de la experiencia normal del alumno.',`<div class="stats"><div class="stat"><strong>8 / 11</strong><span class="muted">activos localmente</span></div><div class="stat"><strong>3</strong><span class="muted">requieren infraestructura</span></div><div class="stat"><strong>${state.day}/90</strong><span class="muted">curso</span></div><div class="stat"><strong>${state.xp}</strong><span class="muted">XP</span></div></div><div class="godgrid">${feats.map(x=>`<div class="feature ${x[3]}"><div class="num">MOTOR ${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p><button class="btn small" onclick="openGodFeature('${x[0]}')">Abrir motor</button></div>`).join('')}</div><div id="godFeaturePanel" class="section"></div>`)}
function runDeepDiag(){const tests=[];const add=(n,o,d='')=>tests.push({n,o,d});add('Estado válido',!!state&&state.day>=1&&state.day<=90);add('90 lecciones',LESSONS.length===90);add('IDs únicos',new Set(LESSONS.map(x=>x.id)).size===90);add('Navegación principal',typeof home==='function'&&typeof course==='function'&&typeof practice==='function');add('Lectura/dos manos/oído',typeof reading==='function'&&typeof twoHands==='function'&&typeof earAdvanced==='function');add('MIDI avanzado',typeof midiNoteOn==='function'&&typeof midiNoteOff==='function');add('Performance real',typeof analyzePerformance==='function'&&!String(analyzePerformance).includes('Math.random'));add('PRS real',typeof startSightTest==='function'&&typeof finishSightTest==='function');add('Diagnóstico 8 pruebas',Array.isArray(ENTRY_TASKS)&&ENTRY_TASKS.length===8);add('Repetición espaciada',typeof scheduleSpaced==='function'&&Array.isArray(state.god.spaced.intervals)&&state.god.spaced.intervals.join(',')==='1,2,4,7,14,30');add('Music Engine MIDI/XML',typeof parseMidiFile==='function'&&typeof parseMusicXML==='function'&&typeof registerMusicFile==='function');add('Biblioteca inteligente',typeof renderGodLibrary==='function'&&typeof filterGodLibrary==='function');add('Backup completo',typeof exportProfile==='function'&&typeof importProfile==='function');add('Microlección contextual',typeof godMicro==='function'&&typeof markMicroSeen==='function');add('PWA',typeof registerPWA==='function'&&typeof installPWA==='function');add('Monetización sin bloqueo',typeof resources==='function'&&typeof trackMonetization==='function'&&!String(resources).includes('location.href='));add('Autonomy aplicado',typeof autonomyHelpForLesson==='function'&&String(genericLesson).includes('autonomyHelpForLesson'));add('LocalStorage',storageTest());add('Arquitectura v40',(AUTONOMIA_ARCHITECTURE.version==='v40.1'||AUTONOMIA_ARCHITECTURE.version==='v40.3')&&AUTONOMIA_ARCHITECTURE.engines.length===6);add('Contrato de datos',typeof autonomySnapshot==='function'&&autonomySnapshot().schemaVersion==='1.0');add('Cola de sync local',typeof getSyncQueue==='function'&&typeof queueSyncEvent==='function');add('Cuentas y nube',typeof cloudRegister==='function'&&typeof cloudLogin==='function'&&typeof cloudSyncNow==='function');add('Audio API',!!(window.AudioContext||window.webkitAudioContext));add('MIDI API',!!navigator.requestMIDIAccess,'opcional según navegador');const out=document.getElementById('diagOut');if(out)out.textContent=tests.map(t=>(t.o?'✓ ':'✗ ')+t.n+(t.d?' · '+t.d:'')).join('\n')+'\n\n'+(tests.filter(t=>!t.o&&t.d!=='opcional según navegador').length?'HAY ERRORES QUE CORREGIR':'AUTODIAGNÓSTICO ESTRUCTURAL OK');return tests}

const CLOUD_API=(window.AUTONOMIA_API_URL||'/api/v1').replace(/\/$/,'');
function escapeHTML(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function getCloudToken(){return localStorage.getItem('autonomia-piano-cloud-token')||''}
function getCloudUser(){try{return JSON.parse(localStorage.getItem('autonomia-piano-cloud-user')||'null')}catch{return null}}
function setCloudSession(token,user){if(token)localStorage.setItem('autonomia-piano-cloud-token',token);if(user)localStorage.setItem('autonomia-piano-cloud-user',JSON.stringify(user));}
function clearCloudSession(){localStorage.removeItem('autonomia-piano-cloud-token');localStorage.removeItem('autonomia-piano-cloud-user')}
function cloudStatusText(){return getCloudToken()?'Sesión local activa · sincronización disponible cuando el servidor responda.':'Modo local · ningún dato sale del dispositivo hasta que vos creás una cuenta y sincronizás.'}
async function cloudRequest(path,options={}){const headers={'content-type':'application/json',...(options.headers||{})};const t=getCloudToken();if(t)headers.authorization='Bearer '+t;const r=await fetch(CLOUD_API+path,{...options,headers});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data.error||('HTTP '+r.status));return data}
function cloudCredentials(){const email=(document.getElementById('cloudEmail')?.value||'').trim(),password=document.getElementById('cloudPassword')?.value||'';if(!email||password.length<8){toast('⚠ Ingresá un email y una contraseña de al menos 8 caracteres');return null}return {email,password}}
async function cloudRegister(){const c=cloudCredentials();if(!c)return;try{const d=await cloudRequest('/auth/register',{method:'POST',body:JSON.stringify(c)});setCloudSession(d.token,d.user);await cloudSyncNow(true);toast('✓ Cuenta creada y progreso sincronizado');show('settings')}catch(e){toast('⚠ '+e.message)}}
async function cloudLogin(){const c=cloudCredentials();if(!c)return;try{const d=await cloudRequest('/auth/login',{method:'POST',body:JSON.stringify(c)});setCloudSession(d.token,d.user);toast('✓ Sesión iniciada');show('settings')}catch(e){toast('⚠ '+e.message)}}
async function cloudLogout(){try{if(getCloudToken())await cloudRequest('/auth/logout',{method:'POST',body:'{}'})}catch{}clearCloudSession();toast('✓ Sesión cerrada');show('settings')}
async function cloudSyncNow(silent=false){if(!getCloudToken()){if(!silent)toast('ℹ️ Primero iniciá sesión');return false}try{const snap=autonomiaSnapshot();await cloudRequest('/profile',{method:'PUT',body:JSON.stringify(snap)});const q=getSyncQueue();for(const ev of q.slice(-100))await cloudRequest('/practice/events',{method:'POST',body:JSON.stringify(ev)});clearSyncQueue();if(!silent)toast('☁ ✓ Progreso sincronizado');return true}catch(e){if(!silent)toast('⚠ No se pudo sincronizar: '+e.message);return false}}
async function cloudLoadProfile(){try{const d=await cloudRequest('/profile');if(!d.profile?.profile){toast('ℹ️ Todavía no hay un respaldo en la nube');return}const incoming=d.profile.profile;if(confirm('Esto reemplazará el progreso local por el respaldo de la nube. ¿Continuar?')){state=normalizeState(incoming);saveState();toast('✓ Progreso recuperado');show('home')}}catch(e){toast('⚠ No se pudo recuperar: '+e.message)}}

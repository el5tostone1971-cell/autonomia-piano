<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Autonomía Piano · Pruebas de la versión actual</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font:14px system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:2;padding:12px 18px;background:#0d1b2e;border-bottom:1px solid #203550}
header strong{display:block;font-size:16px}header span{color:#9eb0c7;font-size:12px}
iframe{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#07111f}
#error{display:none;padding:16px;color:#fecaca;background:#451a1a}
</style>
</head>
<body>
<header><strong>Autonomía Piano · Banco de pruebas</strong><span>Ejecuta run_tests.js sobre index.html (la aplicación vigente), no sobre una copia antigua.</span></header>
<div id="error" role="alert"></div>
<iframe id="app" title="Aplicación actual y resultados de pruebas" src="./index.html?autonomia-test=1"></iframe>
<script>
(function(){
 const frame=document.getElementById('app'),error=document.getElementById('error');
 function showError(message){error.style.display='block';error.textContent='No se pudieron iniciar las pruebas: '+message}
 frame.addEventListener('load',function(){
  try{
   const doc=frame.contentDocument;
   if(!doc||!doc.querySelector('#main')){showError('la aplicación actual no terminó de cargar (#main no encontrado).');return}
   const runner=doc.createElement('script');
   runner.src='./run_tests.js?v=live-20261119-2';
   runner.onerror=function(){showError('no se pudo cargar run_tests.js.');};
   doc.body.appendChild(runner);
  }catch(e){showError(e.message||String(e))}
 });
 frame.addEventListener('error',function(){showError('no se pudo abrir index.html.')});
})();
</script>
</body>
</html>

name: Piano browser smoke tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        run: |
          node server.js > /tmp/autonomia-piano.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/autonomia-piano.log
          exit 1
      - name: Test note display and persistence after reload
        run: node smoke_test.cjs
      - name: Run comprehensive course, Motor 11 and repertoire tests
        run: node run_tests_browser.cjs
      - name: Verify Render deployment
        run: |
          ok=0
          for i in $(seq 1 18); do
            if curl -fsS --max-time 25 https://autonomia-piano.onrender.com/api/v1/health -o /tmp/render-health.json; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          grep -q '"ok":true' /tmp/render-health.json
          curl -fsS --max-time 30 https://autonomia-piano.onrender.com/ -o /tmp/render-index.html
          grep -q 'function insertCourseTeachingGuide' /tmp/render-index.html
          grep -q '.top-actions{width:100%;flex-wrap:wrap;gap:6px}' /tmp/render-index.html
          echo "Render health and latest Portuguese/mobile changes verified."

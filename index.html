const PROGRESS_DB='autonomia-piano-progress-db-v1';
function openProgressDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(new Error('IndexedDB no disponible'));return}
  let req;try{req=indexedDB.open(PROGRESS_DB,1)}catch(e){reject(e);return}
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('progress'))db.createObjectStore('progress')};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('No se pudo abrir IndexedDB'));
 })
}
let progressWriteQueue=Promise.resolve();
function writeProgressIndexedDB(snapshot){
 if(!snapshot)return progressWriteQueue;
 // Serializamos las escrituras: dos guardados rápidos no pueden terminar guardando primero el estado viejo.
 progressWriteQueue=progressWriteQueue.catch(()=>{}).then(()=>openProgressDB()).then(db=>new Promise((resolve,reject)=>{
  let tx;try{tx=db.transaction('progress','readwrite');tx.objectStore('progress').put({snapshot,updatedAt:Date.now()},'current')}catch(e){db.close();reject(e);return}
  tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{const e=tx.error;db.close();reject(e||new Error('Error escribiendo respaldo'))};tx.onabort=()=>{db.close();reject(tx.error||new Error('Respaldo cancelado'))}
 })).catch(e=>{console.warn('[Autonomía Piano] No se pudo escribir respaldo IndexedDB',e);return false});
 return progressWriteQueue;
}
function progressScore(s){
 const lessons=s&&s.lessons&&typeof s.lessons==='object'?s.lessons:{};
 const theory=s&&s.theory&&s.theory.completed&&typeof s.theory.completed==='object'?s.theory.completed:{};
 const repertoire=s&&s.repertoireProgress&&typeof s.repertoireProgress==='object'?s.repertoireProgress:{};
 const spaced=s&&s.god&&s.god.spaced&&Array.isArray(s.god.spaced.queue)?s.god.spaced.queue:[];
 const sessions=s&&s.god&&s.god.performance&&Array.isArray(s.god.performance.sessions)?s.god.performance.sessions:[];
 const lessonCount=Object.values(lessons).filter(Boolean).length;
 const theoryCount=Object.values(theory).filter(Boolean).length;
 const repertoireScore=Object.values(repertoire).reduce((a,v)=>a+Math.max(0,Number(v)||0),0);
 return lessonCount*100000000+theoryCount*100000+repertoireScore*100+spaced.length*10+sessions.length+Math.max(0,Number(s&&s.xp)||0)*.001+Math.max(1,Number(s&&s.day)||1)*.00001;
}
async function restoreProgressIndexedDB(){
 try{
  const db=await openProgressDB();
  const record=await new Promise((resolve,reject)=>{
   let tx;try{tx=db.transaction('progress','readonly');const req=tx.objectStore('progress').get('current');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('No se pudo leer respaldo'))}catch(e){reject(e)}
  });
  db.close();
  if(!record||!record.snapshot)return {ok:true,restored:false};
  const saved=normalizeState(JSON.parse(record.snapshot));
  const before=progressScore(state);
  const merged=mergeProgressStates(state,saved);
  const changed=JSON.stringify(merged)!==JSON.stringify(state);
  if(changed){
   state=merged;
   try{const snap=JSON.stringify(state);localStorage.setItem(KEY,snap);localStorage.setItem('autonomia-piano-progress-backup',snap)}catch(e){}
   renderSide();if(document.getElementById('main'))show(activeView||'home');
   console.info('[Autonomía Piano] Progreso local y respaldo independiente fusionados');
  }
  return {ok:true,restored:changed,completed:Object.values(state.lessons||{}).filter(Boolean).length,scoreBefore:before,scoreAfter:progressScore(state)};

,["Lenguaje musical: fundamentos","Linguagem musical: fundamentos"],["Tonos y semitonos","Tons e semitons"],["Escalas y alteraciones","Escalas e alterações"],["Intervalos y grados","Intervalos e graus"],["El semitono","O semitom"],["El tono","O tom"],["Reconocer distancias","Reconhecer distâncias"],["Escala mayor","Escala maior"],["Construir una escala mayor","Construir uma escala maior"],["Escala menor natural","Escala menor natural"],["Sostenido y bemol","Sustenido e bemol"],["Becuadro","Bequadro"],["Enarmonía","Enarmonia"],["Intervalo: segunda","Intervalo: segunda"],["Intervalo: tercera","Intervalo: terça"],["Intervalo: quinta justa","Intervalo: quinta justa"],["Grados de la escala","Graus da escala"],["Tónica y dominante","Tônica e dominante"],["Aplicación: leer una escala","Aplicação: ler uma escala"],["El semitono es la distancia más pequeña del sistema tonal habitual: entre dos teclas contiguas del piano, sin saltar ninguna. Puede ser entre dos teclas blancas o entre una blanca y una negra.","O semitom é a menor distância do sistema tonal habitual: entre duas teclas vizinhas do piano, sem pular nenhuma. Pode ocorrer entre duas teclas brancas ou entre uma branca e uma preta."],["Mi–Fa y Si–Do son semitonos naturales: no hay tecla negra entre ellas.","Mi–Fá e Si–Dó são semitons naturais: não há tecla preta entre elas."],["¿Qué distancia hay entre Mi y Fa?","Qual é a distância entre Mi e Fá?"],["Un semitono","Um semitom"],["Un tono","Um tom"],["Una tercera","Uma terça"],["Correcto: Mi y Fa son teclas blancas contiguas. Entre ellas hay un semitono.","Correto: Mi e Fá são teclas brancas vizinhas. Entre elas há um semitom."],["Un tono equivale a dos semitonos. En el teclado se avanza dos teclas contiguas contando blancas y negras.","Um tom equivale a dois semitons. No teclado, avançamos duas teclas vizinhas, contando brancas e pretas."],["Do–Re contiene Do♯/Re♭ en el medio: dos semitonos.","Dó–Ré contém Dó♯/Ré♭ no meio: dois semitons."],["¿Cuántos semitonos forman un tono?","Quantos semitons formam um tom?"],["Dos","Dois"],["Tres","Três"],["Correcto: un tono está formado por dos semitonos.","Correto: um tom é formado por dois semitons."],["Para medir una distancia, contá los semitonos entre la nota inicial y la final. No cuentes la tecla inicial como un paso.","Para medir uma distância, conte os semitons entre a nota inicial e a final. Não conte a tecla inicial como um passo."],["Do–Mi: Do→Do♯ (1), Do♯→Re (2), Re→Re♯ (3), Re♯→Mi (4).","Dó–Mi: Dó→Dó♯ (1), Dó♯→Ré (2), Ré→Ré♯ (3), Ré♯→Mi (4)."],["¿Cuántos semitonos hay de Do a Mi?","Quantos semitons há de Dó a Mi?"],["Correcto: Do–Mi tiene cuatro semitonos; es una tercera mayor.","Correto: Dó–Mi tem quatro semitons; é uma terça maior."],["La escala mayor sigue este patrón de distancias: tono, tono, semitono, tono, tono, tono, semitono (T–T–S–T–T–T–S).","A escala maior segue este padrão de distâncias: tom, tom, semitom, tom, tom, tom, semitom (T–T–S–T–T–T–S)."],["Do mayor: Do–Re–Mi–Fa–Sol–La–Si–Do.","Dó maior: Dó–Ré–Mi–Fá–Sol–Lá–Si–Dó."],["¿Entre qué grados aparece el primer semitono de Do mayor?","Entre quais graus aparece o primeiro semitom de Dó maior?"],["Do–Re","Dó–Ré"],["Mi–Fa","Mi–Fá"],["Sol–La","Sol–Lá"],["Correcto: en Do mayor, el primer semitono está entre el tercer y cuarto grado: Mi–Fa.","Correto: em Dó maior, o primeiro semitom está entre o terceiro e o quarto grau: Mi–Fá."],["Para construir una escala mayor desde cualquier nota, respetá el patrón T–T–S–T–T–T–S. Algunas notas deberán alterarse para conservar esas distancias.","Para construir uma escala maior a partir de qualquer nota, respeite o padrão T–T–S–T–T–T–S. Algumas notas precisarão ser alteradas para manter essas distâncias."],["Sol mayor: Sol–La–Si–Do–Re–Mi–Fa♯–Sol.","Sol maior: Sol–Lá–Si–Dó–Ré–Mi–Fá♯–Sol."],["¿Qué nota se altera en Sol mayor?","Qual nota é alterada em Sol maior?"],["Fa♯","Fá♯"],["Do♯","Dó♯"],["Si♭","Si♭"],["Correcto: Fa debe subir un semitono para mantener el patrón de Sol mayor.","Correto: Fá precisa subir um semitom para manter o padrão de Sol maior."],["La escala menor natural usa el patrón T–S–T–T–S–T–T. Su tercer grado está a una tercera menor de la tónica.","A escala menor natural usa o padrão T–S–T–T–S–T–T. Seu terceiro grau está a uma terça menor da tônica."],["La menor natural: La–Si–Do–Re–Mi–Fa–Sol–La.","Lá menor natural: Lá–Si–Dó–Ré–Mi–Fá–Sol–Lá."],["¿Cuál es el patrón de la escala menor natural?","Qual é o padrão da escala menor natural?"],["T–T–S–T–T–T–S","T–T–S–T–T–T–S"],["T–S–T–T–S–T–T","T–S–T–T–S–T–T"],["S–T–T–T–S–T–T","S–T–T–T–S–T–T"],["Correcto: La menor natural sigue T–S–T–T–S–T–T.","Correto: Lá menor natural segue T–S–T–T–S–T–T."],["El sostenido (♯) eleva una nota un semitono. El bemol (♭) la baja un semitono. No son nombres de teclas: describen cómo se modifica una nota.","O sustenido (♯) eleva uma nota em um semitom. O bemol (♭) abaixa uma nota em um semitom. Não são nomes de teclas: descrevem como uma nota é modificada."],["Do♯ suena un semitono por encima de Do; Re♭, uno por debajo de Re.","Dó♯ soa um semitom acima de Dó; Ré♭, um abaixo de Ré."],["¿Qué hace un bemol?","O que faz um bemol?"],["Sube un semitono","Sobe um semitom"],["Baja un semitono","Desce um semitom"],["Sube un tono","Sobe um tom"],["Correcto: el bemol baja la nota un semitono.","Correto: o bemol abaixa a nota em um semitom."],["El becuadro (♮) cancela una alteración previa y devuelve la nota a su altura natural dentro del compás, según las reglas de escritura.","O bequadro (♮) cancela uma alteração anterior e devolve a nota à sua altura natural dentro do compasso, conforme as regras de escrita."],["Si aparece Fa♯ y luego Fa♮ en el mismo compás, el segundo Fa vuelve a la tecla Fa natural.","Se aparecer Fá♯ e depois Fá♮ no mesmo compasso, o segundo Fá volta à tecla Fá natural."],["¿Qué función cumple el becuadro?","Qual é a função do bequadro?"],["Cancela una alteración","Cancela uma alteração"],["Duplica la duración","Duplica a duração"],["Sube dos semitonos","Sobe dois semitons"],["Correcto: el becuadro anula el sostenido o bemol que afectaba esa nota.","Correto: o bequadro anula o sustenido ou bemol que afetava aquela nota."],["Dos notas pueden escribirse de forma diferente y sonar igual en el piano afinado en temperamento igual. Se llaman enarmónicas.","Duas notas podem ser escritas de formas diferentes e soar iguais no piano afinado em temperamento igual. Elas são chamadas enarmônicas."],["Do♯ y Re♭ comparten tecla y altura sonora, aunque su escritura y función pueden diferir.","Dó♯ e Ré♭ compartilham a mesma tecla e altura sonora, embora a escrita e a função possam ser diferentes."],["¿Qué pareja es enarmónica?","Qual par é enarmônico?"],["Do–Re","Dó–Ré"],["Do♯–Re♭","Dó♯–Ré♭"],["Mi–Fa","Mi–Fá"],["Correcto: Do sostenido y Re bemol suenan igual en el piano.","Correto: Dó sustenido e Ré bemol soam iguais no piano."],["Los intervalos nombran la distancia entre dos notas. La segunda abarca dos nombres de nota consecutivos, como Do–Re; puede ser mayor o menor.","Os intervalos nomeiam a distância entre duas notas. A segunda abrange dois nomes consecutivos, como Dó–Ré; pode ser maior ou menor."],["Do–Re es segunda mayor; Mi–Fa es segunda menor.","Dó–Ré é segunda maior; Mi–Fá é segunda menor."],["¿Qué intervalo forman Do y Re?","Qual intervalo é formado por Dó e Ré?"],["Segunda","Segunda"],["Tercera","Terça"],["Quinta","Quinta"],["Correcto: Do y Re son nombres consecutivos: forman una segunda.","Correto: Dó e Ré são nomes consecutivos: formam uma segunda."],["Una tercera abarca tres nombres de nota contando inicio y final: Do–Re–Mi. Puede ser mayor (4 semitonos) o menor (3 semitonos).","Uma terça abrange três nomes de notas, contando o início e o fim: Dó–Ré–Mi. Pode ser maior (4 semitons) ou menor (3 semitons)."],["Do–Mi = tercera mayor; Do–Mi♭ = tercera menor.","Dó–Mi = terça maior; Dó–Mi♭ = terça menor."],["¿Cuántos semitonos tiene una tercera menor?","Quantos semitons tem uma terça menor?"],["Correcto: la tercera menor tiene tres semitonos.","Correto: a terça menor tem três semitons."],["La quinta abarca cinco nombres de nota. La quinta justa contiene siete semitonos y es una referencia importante para construir acordes.","A quinta abrange cinco nomes de notas. A quinta justa contém sete semitons e é uma referência importante para construir acordes."],["Do–Sol: Do–Re–Mi–Fa–Sol, siete semitonos.","Dó–Sol: Dó–Ré–Mi–Fá–Sol, sete semitons."],["¿Cuántos semitonos tiene una quinta justa?","Quantos semitons tem uma quinta justa?"],["Correcto: la quinta justa equivale a siete semitonos.","Correto: a quinta justa equivale a sete semitons."],["Cada nota de una escala tiene un número o grado. En Do mayor: Do es I (tónica), Re II, Mi III, Fa IV, Sol V (dominante), La VI y Si VII (sensible).","Cada nota de uma escala tem um número ou grau. Em Dó maior: Dó é I (tônica), Ré II, Mi III, Fá IV, Sol V (dominante), Lá VI e Si VII (sensível)."],["El grado I da sensación de reposo; el V suele generar tensión que busca volver al I.","O grau I transmite sensação de repouso; o V costuma gerar tensão e buscar o retorno ao I."],["En Do mayor, ¿qué grado es Sol?","Em Dó maior, qual é o grau de Sol?"],["Correcto: Sol es el quinto grado de Do mayor: la dominante.","Correto: Sol é o quinto grau de Dó maior: a dominante."],["La tónica (I) es el centro de reposo tonal. La dominante (V) crea tensión y suele conducir de vuelta a la tónica.","A tônica (I) é o centro de repouso tonal. A dominante (V) cria tensão e geralmente conduz de volta à tônica."],["En Do mayor, el movimiento Sol–Do (V–I) produce una resolución muy reconocible.","Em Dó maior, o movimento Sol–Dó (V–I) produz uma resolução muito reconhecível."],["En Do mayor, ¿cuál es la dominante?","Em Dó maior, qual é a dominante?"],["&gt;Fa&lt;","&gt;Fá&lt;"],["Sol","Sol"],["Correcto: Sol es el quinto grado y funciona como dominante.","Correto: Sol é o quinto grau e funciona como dominante."],["Para analizar una escala, identificá su tónica, escribí los siete grados y verificá el patrón de tonos y semitonos. No alcanza con memorizar la digitación.","Para analisar uma escala, identifique sua tônica, escreva os sete graus e verifique o padrão de tons e semitons. Não basta memorizar a digitação."],["Re mayor: Re–Mi–Fa♯–Sol–La–Si–Do♯–Re. Sus alteraciones son Fa♯ y Do♯.","Ré maior: Ré–Mi–Fá♯–Sol–Lá–Si–Dó♯–Ré. Suas alterações são Fá♯ e Dó♯."],["¿Qué dos notas llevan sostenido en Re mayor?","Quais duas notas têm sustenido em Ré maior?"],["Fa y Do","Fá e Dó"],["Sol y Re","Sol e Ré"],["Mi y La","Mi e Lá"],["Correcto: Re mayor tiene dos sostenidos: Fa♯ y Do♯.","Correto: Ré maior tem dois sustenidos: Fá♯ e Dó♯."],["COMPRENDER ANTES DE RESPONDER","COMPREENDER ANTES DE RESPONDER"],["Elegí una respuesta. La explicación de corrección aparecerá después.","Escolha uma resposta. A explicação da correção aparecerá depois."],["Todavía no.","Ainda não."],["Volvé a leer la explicación y reintentá.","Leia novamente a explicação e tente outra vez."],["Concepto comprendido.","Conceito compreendido."],["Explorá el concepto en el piano","Explore o conceito no piano"],["Tocá las notas del ejemplo en el teclado. Escuchá la distancia y compará las teclas blancas y negras antes de responder.","Toque as notas do exemplo no teclado. Ouça a distância e compare as teclas brancas e pretas antes de responder."],["Qué es una tríada","O que é uma tríade"],["Tríada mayor","Tríade maior"],["Tríada menor","Tríade menor"],["Tríada disminuida","Tríade diminuta"],["Fundamental y nombre del acorde","Fundamental e nome do acorde"],["Estado fundamental","Estado fundamental"],["Primera inversión","Primeira inversão"],["Segunda inversión","Segunda inversão"],["Cifrado mayor y menor","Cifragem maior e menor"],["Acordes de una escala mayor","Acordes de uma escala maior"],["Tónica: función de reposo","Tônica: função de repouso"],["Subdominante: preparación","Subdominante: preparação"],["Dominante: tensión","Dominante: tensão"],["Cadencia V–I","Cadência V–I"],["Conducción de voces","Condução de vozes"],["Una tríada es un acorde de tres notas distintas organizadas por terceras: fundamental, tercera y quinta. Se puede tocar en distintas octavas y seguir siendo el mismo acorde.","Uma tríade é um acorde de três notas diferentes organizadas em terças: fundamental, terça e quinta. Ela pode ser tocada em oitavas diferentes e continuar sendo o mesmo acorde."],["Do–Mi–Sol: fundamental Do, tercera Mi y quinta Sol.","Dó–Mi–Sol: fundamental Dó, terça Mi e quinta Sol."],["¿Qué notas forman la estructura básica de una tríada?","Quais notas formam a estrutura básica de uma tríade?"],["Fundamental, tercera y quinta","Fundamental, terça e quinta"],["Fundamental, cuarta y sexta","Fundamental, quarta e sexta"],["Tres notas consecutivas","Três notas consecutivas"],["La tríada mayor tiene una tercera mayor desde la fundamental (4 semitonos) y una tercera menor desde la tercera hasta la quinta (3 semitonos).","A tríade maior tem uma terça maior a partir da fundamental (4 semitons) e uma terça menor da terça até a quinta (3 semitons)."],["Do mayor: Do–Mi–Sol (4 + 3 semitonos).","Dó maior: Dó–Mi–Sol (4 + 3 semitons)."],["¿Cuál es la estructura en semitonos de una tríada mayor?","Qual é a estrutura em semitons de uma tríade maior?"],["La tríada mayor tiene 4 semitonos y luego 3.","A tríade maior tem 4 semitons e depois 3."],["La tríada menor invierte las distancias: tercera menor desde la fundamental y tercera mayor hasta la quinta.","A tríade menor inverte as distâncias: terça menor a partir da fundamental e terça maior até a quinta."],["La menor: La–Do–Mi (3 + 4 semitonos).","Lá menor: Lá–Dó–Mi (3 + 4 semitons)."],["¿Cuál es la estructura de una tríada menor?","Qual é a estrutura de uma tríade menor?"],["La tríada menor tiene 3 semitonos y luego 4.","A tríade menor tem 3 semitons e depois 4."],["La tríada disminuida contiene dos terceras menores superpuestas. Su quinta queda disminuida y produce una sonoridad inestable.","A tríade diminuta contém duas terças menores sobrepostas. Sua quinta fica diminuta e produz uma sonoridade instável."],["Si disminuido: Si–Re–Fa (3 + 3 semitonos).","Si diminuto: Si–Ré–Fá (3 + 3 semitons)."],["¿Qué distancias forman una tríada disminuida?","Quais distâncias formam uma tríade diminuta?"],["La tríada disminuida se construye con dos terceras menores: 3 + 3.","A tríade diminuta é construída com duas terças menores: 3 + 3."],["La fundamental es la nota que da nombre al acorde. En Do mayor, Do es la fundamental aunque las notas aparezcan en otro orden o en otras octavas.","A fundamental é a nota que dá nome ao acorde. Em Dó maior, Dó é a fundamental mesmo que as notas apareçam em outra ordem ou em outras oitavas."],["Mi–Sol–Do sigue siendo Do mayor: las notas son las mismas, pero están invertidas.","Mi–Sol–Dó continua sendo Dó maior: as notas são as mesmas, mas estão invertidas."],["En Sol–Do–Mi, ¿cuál es la fundamental del acorde?","Em Sol–Dó–Mi, qual é a fundamental do acorde?"],["Sol","Sol"],["&gt;Do&lt;","&gt;Dó&lt;"],["Mi","Mi"],["Las notas Sol–Do–Mi forman Do mayor en primera inversión; Do es la fundamental.","As notas Sol–Dó–Mi formam Dó maior na primeira inversão; Dó é a fundamental."],["Un acorde está en estado fundamental cuando su fundamental es la nota más grave. Las otras notas se apilan por encima.","Um acorde está no estado fundamental quando sua fundamental é a nota mais grave. As outras notas ficam acima dela."],["Do–Mi–Sol, con Do en el bajo.","Dó–Mi–Sol, com Dó no baixo."],["¿Qué nota debe estar en el bajo en el estado fundamental de Do mayor?","Qual nota deve estar no baixo no estado fundamental de Dó maior?"],["En estado fundamental, la fundamental Do ocupa el bajo.","No estado fundamental, a fundamental Dó ocupa o baixo."],["En primera inversión, la tercera del acorde pasa al bajo. El acorde conserva sus notas y su identidad, pero cambia la disposición.","Na primeira inversão, a terça do acorde passa para o baixo. O acorde mantém suas notas e identidade, mas muda a disposição."],["Do mayor: Mi–Sol–Do.","Dó maior: Mi–Sol–Dó."],["¿Qué nota queda en el bajo en la primera inversión de Do mayor?","Qual nota fica no baixo na primeira inversão de Dó maior?"],["La tercera Mi pasa al bajo en la primera inversión.","A terça Mi passa para o baixo na primeira inversão."],["En segunda inversión, la quinta del acorde queda en el bajo. La fundamental y la tercera quedan por encima.","Na segunda inversão, a quinta do acorde fica no baixo. A fundamental e a terça ficam acima."],["Do mayor: Sol–Do–Mi.","Dó maior: Sol–Dó–Mi."],["¿Qué nota queda en el bajo en la segunda inversión de Do mayor?","Qual nota fica no baixo na segunda inversão?"],["La quinta Sol queda en el bajo en segunda inversión.","A quinta Sol fica no baixo na segunda inversão."],["En cifrado americano, una letra sola suele indicar acorde mayor; la letra seguida de m indica menor.","Na cifra americana, uma letra sozinha geralmente indica acorde maior; a letra seguida de m indica menor."],["C = Do mayor. Cm = Do menor. Am = La menor.","C = Dó maior. Cm = Dó menor. Am = Lá menor."],["¿Qué significa Am?","O que significa Am?"],["La mayor","Lá maior"],["La menor","Lá menor"],["La disminuida","Lá diminuta"],["La m minúscula indica acorde menor: Am es La menor.","O m minúsculo indica acorde menor: Am é Lá menor."],["Al armonizar una escala mayor apilando terceras diatónicas, aparecen tríadas mayores en I, IV y V; menores en II, III y VI; y disminuida en VII.","Ao harmonizar uma escala maior empilhando terças diatônicas, surgem tríades maiores em I, IV e V; menores em II, III e VI; e diminuta em VII."],["En Do mayor: C, Dm, Em, F, G, Am, Bdim.","Em Dó maior: C, Dm, Em, F, G, Am, Bdim."],["¿Qué calidad tiene el acorde construido sobre el quinto grado de una escala mayor?","Qual é a qualidade do acorde construído sobre o quinto grau de uma escala maior?"],["Mayor","Maior"],["Menor","Menor"],["Disminuido","Diminuto"],["El quinto grado de una escala mayor forma una tríada mayor.","O quinto grau de uma escala maior forma uma tríade maior."],["La función de tónica representa estabilidad y reposo. El acorde I suele sentirse como punto de llegada y centro tonal.","A função de tônica representa estabilidade e repouso. O acorde I geralmente é sentido como ponto de chegada e centro tonal."],["En Do mayor, C es el acorde I y cumple función de tónica.","Em Dó maior, C é o acorde I e exerce a função de tônica."],["¿Qué función cumple el acorde I?","Qual função o acorde I exerce?"],["Tónica","Tônica"],["El grado I es la tónica, el centro de reposo.","O grau I é a tônica, o centro de repouso."],["La función subdominante suele alejarse del reposo de la tónica y preparar el movimiento hacia la dominante.","A função subdominante geralmente se afasta do repouso da tônica e prepara o movimento em direção à dominante."],["En Do mayor, F (IV) suele conducir hacia G (V).","Em Dó maior, F (IV) geralmente conduz a G (V)."],["En Do mayor, ¿qué acorde representa el IV?","Em Dó maior, qual acorde representa o IV?"],["F es el cuarto grado y cumple función subdominante.","F é o quarto grau e exerce a função subdominante."],["La dominante (V) genera tensión que suele resolver en la tónica (I). En música tonal, esta relación organiza muchísimas cadencias.","A dominante (V) gera tensão que geralmente se resolve na tônica (I). Na música tonal, essa relação organiza muitas cadências."],["En Do mayor: G → C (V–I).","Em Dó maior: G → C (V–I)."],["¿Qué acorde es la dominante en Do mayor?","Qual acorde é a dominante em Dó maior?"],["G es el quinto grado de Do mayor y funciona como dominante.","G é o quinto grau de Dó maior e funciona como dominante."],["La cadencia auténtica V–I conduce desde la dominante a la tónica. Es una de las resoluciones más fuertes de la armonía tonal.","A cadência autêntica V–I conduz da dominante à tônica. É uma das resoluções mais fortes da harmonia tonal."],["G–C: Sol mayor resuelve en Do mayor.","G–C: Sol maior resolve em Dó maior."],["¿Qué progresión representa una cadencia V–I en Do mayor?","Qual progressão representa uma cadência V–I em Dó maior?"],["C–F","C–F"],["F–G","F–G"],["G–C","G–C"],["G–C es dominante–tónica (V–I) en Do mayor.","G–C é dominante–tônica (V–I) em Dó maior."],["Una buena conducción de voces busca que cada nota se mueva lo mínimo posible entre acordes, evitando saltos innecesarios y manteniendo notas comunes cuando conviene.","Uma boa condução de vozes busca que cada nota se mova o mínimo possível entre acordes, evitando saltos desnecessários e mantendo notas comuns quando conveniente."],["Al pasar de C (C–E–G) a Am (A–C–E), Do y Mi pueden mantenerse; Sol baja a La.","Ao passar de C (C–E–G) para Am (A–C–E), Dó e Mi podem permanecer; Sol desce para Lá."],["¿Qué busca principalmente una conducción de voces fluida?","O que uma condução de vozes fluida busca principalmente?"],["Mover todas las notas lo máximo posible","Mover todas as notas o máximo possível"],["Reducir movimientos innecesarios y conservar notas comunes","Reduzir movimentos desnecessários e conservar notas comuns"],["Cambiar siempre de octava","Sempre mudar de oitava"],["La conducción fluida minimiza movimientos y aprovecha notas comunes.","A condução fluida minimiza movimentos e aproveita notas comuns."],["Respondé la pregunta para habilitar la evaluación práctica.","Responda à pergunta para habilitar a avaliação prática."],["Tocá las tres notas de cada acorde, juntas y dentro de una ventana breve. Podés usar distintas octavas. Después comprobá el orden.","Toque as três notas de cada acorde juntas e dentro de um intervalo curto. Você pode usar oitavas diferentes. Depois confira a ordem."],["Primero respondé correctamente la pregunta de teoría.","Primeiro responda corretamente à pergunta de teoria."],["Ahora formá la progresión en el teclado.","Agora forme a progressão no teclado."],["Todavía no.","Ainda não."],["Estudiá el concepto, observá el ejemplo y resolvé una comprobación concreta antes de avanzar.","Estude o conceito, observe o exemplo e responda a uma verificação concreta antes de avançar."],["Construcción de tríadas","Construção de tríades"],["Raíz y calidad del acorde","Fundamental e qualidade do acorde"],["Progresión armónica","Progressão harmônica"],["Cambios con pulso","Trocas no pulso"],["Acordes en contexto","Acordes em contexto"],["Formá cada tríada, escuchá su calidad y enlazá los acordes sin perder el pulso. La evaluación comprueba las notas y el orden de la progresión.","Forme cada tríade, ouça sua sonoridade e conecte os acordes sem perder a pulsação. A avaliação verifica as notas e a ordem da progressão."],["El pentagrama","A pauta musical"],["Clave de Sol","Clave de Sol"],["Notas en las líneas","Notas nas linhas"],["Notas en los espacios","Notas nos espaços"],["Dirección y altura","Direção e altura"],["Líneas adicionales","Linhas suplementares"],["Do central y teclado","Dó central e teclado"],["Octavas","Oitavas"],["Figuras y duración","Figuras e duração"],["Corcheas","Colcheias"],["Silencios","Pausas"],["Compás y 4/4","Compasso e 4/4"],["Barra de compás","Barra de compasso"],["Sostenidos y bemoles en la lectura","Sustenidos e bemóis na leitura"],["Armadura y alteración accidental","Armadura e acidente musical"],["El pentagrama tiene cinco líneas horizontales y cuatro espacios. Las notas se escriben sobre una línea o dentro de un espacio; la posición vertical indica su altura.","A pauta musical tem cinco linhas horizontais e quatro espaços. As notas são escritas sobre uma linha ou dentro de um espaço; a posição vertical indica sua altura."],["Se cuentan las líneas desde abajo hacia arriba: primera, segunda, tercera, cuarta y quinta.","As linhas são contadas de baixo para cima: primeira, segunda, terceira, quarta e quinta."],["¿Cuántas líneas tiene el pentagrama?","Quantas linhas tem a pauta musical?"],["Cuatro","Quatro"],["Cinco","Cinco"],["Seis","Seis"],["El pentagrama tiene cinco líneas y cuatro espacios.","A pauta musical tem cinco linhas e quatro espaços."],["La clave de Sol indica dónde se escribe la nota Sol. Su espiral rodea la segunda línea contando desde abajo; esa línea es Sol4.","A clave de Sol indica onde a nota Sol é escrita. Sua espiral envolve a segunda linha contando de baixo; essa linha é Sol4."],["En clave de Sol, la segunda línea desde abajo corresponde a Sol4.","Na clave de Sol, a segunda linha de baixo corresponde a Sol4."],["¿En qué línea se ubica Sol en clave de Sol?","Em qual linha fica Sol na clave de Sol?"],["Primera línea","Primeira linha"],["Segunda línea","Segunda linha"],["Quinta línea","Quinta linha"],["La clave de Sol fija Sol en la segunda línea desde abajo.","A clave de Sol fixa Sol na segunda linha de baixo."],["En clave de Sol, las cinco líneas desde abajo son Mi–Sol–Si–Re–Fa. Recordar esta secuencia ayuda a leer sin contar desde cero.","Na clave de Sol, as cinco linhas de baixo para cima são Mi–Sol–Si–Ré–Fá. Memorizar essa sequência ajuda a ler sem contar desde o início."],["Mi4, Sol4, Si4, Re5 y Fa5.","Mi4, Sol4, Si4, Ré5 e Fá5."],["¿Qué nota está en la tercera línea desde abajo?","Qual nota está na terceira linha de baixo?"],["Sol","Sol"],["Si","Si"],["La tercera línea desde abajo es Si4.","A terceira linha de baixo é Si4."],["Los cuatro espacios desde abajo son Fa–La–Do–Mi. Las notas avanzan por grados conjuntos alternando línea y espacio.","Os quatro espaços de baixo para cima são Fá–Lá–Dó–Mi. As notas avançam por graus conjuntos, alternando linha e espaço."],["Fa4, La4, Do5 y Mi5.","Fá4, Lá4, Dó5 e Mi5."],["¿Qué nota ocupa el segundo espacio desde abajo?","Qual nota ocupa o segundo espaço de baixo?"],["La","Lá"],["Mi","Mi"],["El segundo espacio desde abajo corresponde a La4.","O segundo espaço de baixo corresponde a Lá4."],["Cuando una nota sube en el pentagrama, su altura sonora sube. Cuando baja, la altura sonora baja. Cada paso a la posición inmediata siguiente avanza una nota de la escala.","Quando uma nota sobe na pauta, sua altura sonora sobe. Quando desce, a altura sonora fica mais grave. Cada passo para a posição imediatamente seguinte avança uma nota da escala."],["Mi–Fa–Sol asciende; Sol–Fa–Mi desciende.","Mi–Fá–Sol sobe; Sol–Fá–Mi desce."],["Si una nota aparece más arriba en el pentagrama, ¿qué indica?","Se uma nota aparece mais acima na pauta, o que isso indica?"],["Un sonido más agudo","Um som mais agudo"],["Un sonido más grave","Um som mais grave"],["Una nota más larga","Uma nota mais longa"],["La posición más alta representa una altura sonora más aguda.","A posição mais alta representa uma altura sonora mais aguda."],["Cuando una nota queda fuera del pentagrama, se agregan pequeñas líneas llamadas líneas adicionales. No se cambia la lógica de alternar líneas y espacios.","Quando uma nota fica fora da pauta, são acrescentadas pequenas linhas chamadas linhas suplementares. A lógica de alternar linhas e espaços continua a mesma."],["Do4 suele escribirse en una línea adicional debajo del pentagrama en clave de Sol.","Dó4 geralmente é escrito em uma linha suplementar abaixo da pauta na clave de Sol."],["¿Para qué sirven las líneas adicionales?","Para que servem as linhas suplementares?"],["Para indicar silencios","Para indicar pausas"],["Para escribir notas fuera del pentagrama","Para escrever notas fora da pauta"],["Para cambiar el compás","Para mudar o compasso"],["Las líneas adicionales permiten escribir notas más agudas o graves que el pentagrama principal.","As linhas suplementares permitem escrever notas mais agudas ou mais graves do que a pauta principal."],["Do central (Do4) es una referencia para conectar el pentagrama con el piano. En el teclado de 88 teclas suele estar cerca del centro; en el dibujo aparece con una línea adicional debajo de la clave de Sol.","O Dó central (Dó4) é uma referência para conectar a pauta ao piano. Em um teclado de 88 teclas, costuma ficar perto do centro; no desenho aparece com uma linha suplementar abaixo da clave de Sol."],["Do4 corresponde a MIDI 60 y está inmediatamente a la izquierda del grupo de dos teclas negras de esa octava.","Dó4 corresponde ao MIDI 60 e fica imediatamente à esquerda do grupo de duas teclas pretas dessa oitava."],["¿Qué nota se usa como referencia para conectar el pentagrama con el centro del piano?","Qual nota é usada como referência para conectar a pauta ao centro do piano?"],["Do central","Dó central"],["Sol5","Sol5"],["La3","Lá3"],["Do central (Do4) es una referencia fundamental para ubicar la lectura en el teclado.","Dó central (Dó4) é uma referência fundamental para localizar a leitura no teclado."],["Después de siete nombres de nota, la secuencia vuelve a Do en otra octava. El nombre se repite, pero la frecuencia se duplica al subir una octava.","Depois de sete nomes de notas, a sequência volta a Dó em outra oitava. O nome se repete, mas a frequência dobra ao subir uma oitava."],["Do4–Re4–…–Si4–Do5.","Dó4–Ré4–…–Si4–Dó5."],["¿Qué sucede al subir una octava?","O que acontece ao subir uma oitava?"],["Se repite el nombre en una altura más aguda","O nome se repete em uma altura mais aguda"],["La nota dura el doble","A nota dura o dobro"],["La nota baja un semitono","A nota desce um semitom"],["La octava repite el nombre de la nota en un registro más agudo.","A oitava repete o nome da nota em um registro mais agudo."],["Las figuras indican cuánto dura un sonido en relación con el pulso. En una referencia habitual de 4/4: redonda = 4 pulsos, blanca = 2 y negra = 1.","As figuras indicam quanto tempo um som dura em relação à pulsação. Em uma referência habitual de 4/4: semibreve = 4 pulsos, mínima = 2 e semínima = 1."],["Una redonda equivale a dos blancas o cuatro negras.","Uma semibreve equivale a duas mínimas ou quatro semínimas."],["En 4/4, ¿cuántos pulsos dura una negra?","Em 4/4, quantos pulsos dura uma semínima?"],["Uno","Um"],["Dos","Dois"],["Cuatro","Quatro"],["En el ejemplo de 4/4, la negra dura un pulso.","No exemplo de 4/4, a semínima dura um pulso."],["Dos corcheas ocupan el mismo tiempo que una negra. Se suelen contar como “1 y” dentro de un pulso subdividido en dos partes iguales.","Duas colcheias ocupam o mesmo tempo que uma semínima. Costumam ser contadas como “1 e” dentro de um pulso dividido em duas partes iguais."],["Una negra puede dividirse en dos corcheas: ta–ta dentro de un pulso.","Uma semínima pode ser dividida em duas colcheias: ta–ta dentro de um pulso."],["¿Cuántas corcheas equivalen a una negra?","Quantas colcheias equivalem a uma semínima?"],["Una","Uma"],["Dos","Duas"],["Cuatro","Quatro"],["Dos corcheas equivalen a una negra.","Duas colcheias equivalem a uma semínima."],["Cada figura tiene un silencio equivalente. El silencio no es una nota suave: indica que no se debe producir sonido durante esa duración.","Cada figura tem uma pausa equivalente. A pausa não é uma nota suave: indica que nenhum som deve ser produzido durante aquela duração."],["Un silencio de negra ocupa un pulso en 4/4.","Uma pausa de semínima ocupa um pulso em 4/4."],["¿Qué indica un silencio de negra?","O que indica uma pausa de semínima?"],["Un sonido muy suave","Um som muito suave"],["No tocar durante un pulso","Não tocar durante um pulso"],["Tocar dos notas juntas","Tocar duas notas juntas"],["El silencio de negra indica un pulso sin sonido.","A pausa de semínima indica um pulso sem som."],["El compás organiza los pulsos en grupos. En 4/4 hay cuatro pulsos por compás y la negra es la unidad de pulso indicada por el denominador.","O compasso organiza as pulsações em grupos. Em 4/4 há quatro pulsos por compasso e a semínima é a unidade de pulsação indicada pelo denominador."],["Contá 1–2–3–4 y repetí el patrón al comenzar el siguiente compás.","Conte 1–2–3–4 e repita o padrão ao começar o compasso seguinte."],["¿Cuántos pulsos de negra hay en un compás de 4/4?","Quantos pulsos de semínima há em um compasso de 4/4?"],["El numerador 4 indica cuatro pulsos por compás; el denominador 4 señala la negra como unidad.","O numerador 4 indica quatro pulsos por compasso; o denominador 4 indica a semínima como unidade."],["La barra de compás es una línea vertical que separa un compás del siguiente. Ayuda a organizar la lectura y a ubicar los tiempos fuertes.","A barra de compasso é uma linha vertical que separa um compasso do seguinte. Ajuda a organizar a leitura e localizar os tempos fortes."],["En 4/4, después de contar cuatro pulsos se llega a la barra de compás.","Em 4/4, depois de contar quatro pulsos chega-se à barra de compasso."],["¿Qué separa una barra de compás?","O que uma barra de compasso separa?"],["Dos notas iguales","Duas notas iguais"],["Un compás del siguiente","Um compasso do seguinte"],["La clave de Sol de la clave de Fa","A clave de Sol da clave de Fá"],["La barra de compás delimita el final de un compás y el comienzo del siguiente.","A barra de compasso delimita o fim de um compasso e o início do seguinte."],["Un sostenido eleva la nota un semitono y un bemol la baja un semitono. El símbolo se coloca antes de la nota en la escritura musical.","Um sustenido eleva a nota em um semitom e um bemol a abaixa em um semitom. O símbolo é colocado antes da nota na escrita musical."],["Fa♯ se toca un semitono por encima de Fa; Si♭, un semitono por debajo de Si.","Fá♯ é tocado um semitom acima de Fá; Si♭, um semitom abaixo de Si."],["¿Qué indica el símbolo ♯?","O que indica o símbolo ♯?"],["Subir un semitono","Subir um semitom"],["Bajar un semitono","Descer um semitom"],["Duplicar la duración","Dobrar a duração"],["El sostenido eleva la nota un semitono.","O sustenido eleva a nota em um semitom."],["La armadura aparece junto a la clave y señala alteraciones que se aplican durante la pieza. Una alteración accidental aparece antes de una nota y modifica su altura según las reglas del compás.","A armadura aparece junto à clave e indica alterações que se aplicam durante a peça. Um acidente aparece antes de uma nota e modifica sua altura conforme as regras do compasso."],["Una armadura con Fa♯ indica que los Fa se tocan sostenidos, salvo que un becuadro lo cancele.","Uma armadura com Fá♯ indica que os Fás são tocados sustenidos, a menos que um bequadro os cancele."],["¿Dónde aparece la armadura de clave?","Onde aparece a armadura de clave?"],["Al final del pentagrama","No final da pauta"],["Después de la clave y antes del compás","Depois da clave e antes do compasso"],["Debajo de cada nota","Abaixo de cada nota"],["La armadura se escribe inmediatamente después de la clave, antes de la indicación de compás.","A armadura é escrita imediatamente depois da clave, antes da indicação de compasso."],["Respondé para habilitar la comprobación de lectura.","Responda para habilitar a verificação da leitura."],["Primero comprendé la regla de lectura; después resolvé el pentagrama y trasladá la frase al teclado.","Primeiro compreenda a regra de leitura; depois resolva a pauta e transfira a frase para o teclado."],["Primero respondé correctamente la pregunta de teoría.","Primeiro responda corretamente à pergunta de teoria."],["Ahora resolvé la lectura del pentagrama y tocá la frase.","Agora resolva a leitura da pauta e toque a frase."]];

[1],0),score=weight?Math.round(components.reduce((a,x)=>a+x[0]*x[1],0)/weight):0;const previous=state.god.performance||{};state.god.performance=Object.assign({},previous,{velocity:Math.round(mean(velocities)),duration:durations.length?Math.round(mean(durations)):0,timing:timingConsistency===null?0:Math.round(timingConsistency),pedal:t.pedal,velocityConsistency:velocityConsistency===null?0:Math.round(velocityConsistency),durationConsistency:durationConsistency===null?0:Math.round(durationConsistency),timingConsistency:timingConsistency===null?0:Math.round(timingConsistency),chordTightness:chordTightness===null?null:Math.round(chordTightness),dynamicsRange,balance:Math.round(balance),score,sessions:[...(previous.sessions||[]),{date:new Date().toLocaleString('es-AR'),score,velocityConsistency:velocityConsistency===null?'—':Math.round(velocityConsistency),timingConsistency:timingConsistency===null?'—':Math.round(timingConsistency),notes:ons.length,durationNotes:durations.length,chords:chords.length}].slice(-30)});state.diagnostics.counts=state.diagnostics.counts||{};state.diagnostics.counts.performance=(state.diagnostics.counts.performance||0)+1;saveState();toast('✓ MIDI analizado: '+score+'/100 · '+ons.length+' ataques · '+chords.length+' acordes detectados');openGodFeature('03')}

function finishEntryTask(){const t=ENTRY_TASKS[entryDiagTask],input=entryDiagInput.slice(),times=entryDiagTimes.slice();let score=0,detail='';if(t.mode==='rhythm'){const ints=times.slice(1).map((x,i)=>x-times[i]);const err=ints.reduce((a,x)=>a+Math.abs(x-500),0)/Math.max(1,ints.length);score=Math.max(0,Math.round(100-err/4));detail='desvío medio '+Math.round(err)+' ms'}else if(t.mode==='chord'){const got=new Set(input),hit=t.expected.filter(n=>got.has(n)).length,spread=times.length>1?Math.max(...times)-Math.min(...times):999;score=Math.round(hit/t.expected.length*100*(spread<=120?1:Math.max(.25,1-(spread-120)/600)));detail='notas correctas '+hit+'/'+t.expected.length+' · separación '+Math.round(spread)+' ms'}else{const hits=t.expected.reduce((a,n,i)=>a+(input[i]===n?1:0),0);score=Math.round(hits/t.expected.length*100);detail='coincidencias '+hits+'/'+t.expected.length;if(t.mode==='timed'&&times.length>1){const ints=times.slice(1).map((x,i)=>x-times[i]);const drift=ints.reduce((a,x)=>a+Math.abs(x-500),0)/Math.max(1,ints.length);score=Math.round(score*.65+Math.max(0,100-drift/4)*.35);detail+=' · desvío rítmico '+Math.round(drift)+' ms'}}const results=state.god.diagnostic.results||[];results.push({id:t.id,score,input,times:times.map(x=>Math.round(x)),detail,at:new Date().toISOString()});state.god.diagnostic.results=results;entryDiagInput=[];entryDiagTimes=[];if(entryDiagTask<ENTRY_TASKS.length-1){entryDiagTask++;saveState();openGodFeature('04');const next=ENTRY_TASKS[entryDiagTask];if(next.id==='ear')setTimeout(()=>playEntryCue('ear'),150);if(next.id==='memory')setTimeout(()=>playEntryCue('memory'),150);return true}return finishEntryDiagnostic()}

  ['T08','Lectura aplicada','Ahora combinamos clave, líneas, espacios, notas guía y movimiento. El objetivo no es nombrar todo lentamente: es anticipar la dirección y la distancia.','Leer grupos y relaciones es más eficiente que descifrar una nota aislada.',0,'¿Qué conviene mirar primero en una frase?',['Solo la última nota','Dirección y relaciones','El pedal','La marca de dinámica'],1]
 ]},
 {id:2,title:'Ritmo y tiempo',lessons:[
  ['T09','El pulso','El pulso es la regularidad que organiza el tiempo musical. Podés imaginarlo como pasos iguales mientras la música cambia de notas.','Pulso = regularidad temporal.',1,'¿Qué organiza el pulso?',['La altura','La regularidad del tiempo','La digitación','La tonalidad'],1],
  ['T10','Figuras rítmicas y sus valores','Las figuras indican duración relativa. Como referencia, una redonda equivale a dos blancas, cuatro negras, ocho corcheas o dieciséis semicorcheas. Si en un ejercicio de 4/4 la negra vale un pulso, la blanca dura dos pulsos y la corchea medio pulso. El tempo determina cuánto duran esos pulsos en segundos.','Redonda = 4 negras · blanca = 2 negras · negra = 2 corcheas · corchea = 2 semicorcheas.',1,'¿Cuántas negras equivalen a una blanca?',['1','2','3','4'],1],
  ['T11','Silencios y sus valores','Cada figura tiene un silencio equivalente: durante ese tiempo no se inicia ningún sonido, pero el pulso sigue avanzando. Una pausa de negra ocupa lo mismo que una negra; una pausa de blanca ocupa dos pulsos si la negra vale un pulso. No confundas silencio con detener el conteo.','El silencio no suena, pero sí dura.',1,'¿Qué debe continuar durante un silencio?',['El conteo del pulso','El sonido de la nota anterior siempre','El cambio de tonalidad','El pedal obligatoriamente'],0],
  ['T12','Compás y cifra indicadora','El compás organiza los pulsos en grupos. En una cifra como 4/4, el número superior indica que se agrupan cuatro unidades de pulso; el número inferior indica qué figura se toma como unidad de referencia en la notación. En 3/4 contamos tres pulsos por compás; en 4/4, cuatro.','3/4 = tres pulsos por compás · 4/4 = cuatro pulsos por compás.',1,'¿Cuántos pulsos se agrupan normalmente en 3/4?',['2','3','4','6'],1],
  ['T13','Barras y acentos','Las barras de compás separan grupos. El primer pulso suele sentirse como referencia fuerte, aunque la música puede desplazar los acentos.','La barra organiza; el acento da sensación de jerarquía.',1,'¿Qué separa una barra de compás?',['Notas iguales','Grupos métricos','Claves','Octavas'],1],
  ['T14','Puntillo','Un puntillo agrega la mitad del valor de una figura a su duración original. Una negra con puntillo dura una negra más una corchea.','Puntillo = valor original + la mitad.',1,'¿Qué agrega un puntillo?',['El doble','La mitad del valor original','Una negra fija','Un silencio'],1],
  ['T15','Ligadura','Una ligadura de prolongación une duraciones de la misma altura. No significa volver a atacar la nota: significa sostenerla más tiempo.','Ligadura de prolongación = sumar duraciones.',1,'¿Qué hace una ligadura de prolongación?',['Repite el ataque','Suma duraciones','Cambia la altura','Cambia el compás'],1],
  ['T16','Lectura rítmica','Antes de tocar notas, podemos leer solo el ritmo: pulso, figuras, silencios y compás. Separar variables hace más precisa la práctica.','Primero estabilidad; después velocidad.',1,'¿Qué conviene aislar cuando el ritmo falla?',['La teoría del acorde','El ritmo','El pedal','La tonalidad'],1]
 ]},
 {id:3,title:'Tonos, semitonos y escalas',lessons:[
  ['T17','Teclas vecinas','En el teclado, dos teclas contiguas forman un semitono. Dos semitonos forman un tono. Esta medida permite entender escalas y alteraciones.','Semitono = distancia mínima entre teclas vecinas.',2,'¿Cuántos semitonos forman un tono?',['1','2','3','4'],1],
  ['T18','Sostenido, bemol y becuadro','El sostenido sube una nota un semitono, el bemol la baja un semitono y el becuadro cancela una alteración previa.','♯ sube; ♭ baja; ♮ cancela.',2,'¿Qué hace un bemol?',['Sube un semitono','Baja un semitono','Duplica la duración','Cambia el compás'],1],
  ['T19','Escala mayor','Una escala mayor sigue un patrón de tonos y semitonos: T–T–S–T–T–T–S. Ese patrón genera su carácter y organiza sus grados.','Mayor: 2–2–1–2–2–2–1 semitonos.',2,'¿Cuál es el patrón de la escala mayor?',['T-T-S-T-T-T-S','T-S-T-T-S-T-T','S-S-T-T-T-S-T','T-T-T-T-S-S-S'],0],
  ['T20','Grados de la escala','Cada nota de una escala tiene un grado. El primero es la tónica, el quinto suele funcionar como dominante y el séptimo puede crear tensión hacia la tónica.','I = tónica; V = dominante.',2,'¿Qué grado es la tónica?',['I','II','V','VII'],0],
  ['T21','Tonalidad','La tonalidad define un centro de gravedad musical. Una pieza en Do mayor no es solo una colección de notas: Do funciona como referencia de reposo.','Tonalidad = centro + organización de alturas.',2,'¿Qué define principalmente una tonalidad?',['El instrumento','El centro tonal','La velocidad','El volumen'],1],
  ['T22','Armadura','La armadura reúne sostenidos o bemoles que afectan de manera estable a una tonalidad, salvo que aparezcan alteraciones accidentales.','La armadura prepara el mapa tonal.',2,'¿Para qué sirve la armadura?',['Indicar el tempo','Establecer alteraciones habituales','Indicar digitación','Marcar silencios'],1]
 ]},
 {id:4,title:'Intervalos',lessons:[
  ['T23','Qué es un intervalo','Un intervalo mide la distancia entre dos alturas. Se puede pensar como distancia en nombres de notas y también como cantidad de semitonos.','Intervalo = relación de distancia entre dos notas.',3,'¿Qué mide un intervalo?',['Duración','Distancia entre alturas','Volumen','Tempo'],1],
  ['T24','Segundas y terceras','Una segunda abarca dos nombres de nota consecutivos; una tercera abarca tres. La lectura por intervalos permite reconocer formas en vez de contar cada nota.','Segunda = 2 nombres; tercera = 3.',3,'¿Cuántos nombres de nota abarca una tercera?',['2','3','4','5'],1],
  ['T25','Cuartas y quintas','Cuarta y quinta son relaciones muy frecuentes en melodía y armonía. Reconocerlas visualmente ayuda a anticipar el movimiento.','Cuarta = 4 nombres; quinta = 5.',3,'¿Cuántos nombres abarca una quinta?',['3','4','5','6'],2],
  ['T26','Sextas y séptimas','Sexta y séptima son intervalos amplios que aparecen mucho en melodías. Conviene reconocer su contorno antes que calcularlos siempre desde cero.','El contorno visual anticipa el salto.',3,'¿Cuál es más grande?',['Tercera','Quinta','Sexta','Segunda'],2],
  ['T27','La octava','Una octava conecta una nota con la siguiente aparición de su mismo nombre. En el piano son 12 semitonos.','Octava = 12 semitonos.',3,'¿Cuántos semitonos tiene una octava?',['7','8','10','12'],3],
  ['T28','Intervalos en lectura','Ahora usamos intervalos para leer grupos: mirá la forma, la dirección y el tamaño antes de pensar en nombres individuales.','La lectura eficiente combina referencia + intervalo + dirección.',3,'¿Qué ayuda a leer más rápido?',['Contar cada nota desde cero','Reconocer relaciones','Ignorar el ritmo','Memorizar una página'],1]
 ]},
 {id:5,title:'Armonía funcional',lessons:[
  ['T29','Qué es un acorde','Un acorde combina varias alturas simultáneas. En la práctica, el oído reconoce su color y la teoría explica su estructura y función.','Acorde = varias notas simultáneas organizadas.',4,'¿Qué es un acorde?',['Una sola nota','Varias alturas simultáneas','Solo un ritmo','Una clave'],1],
  ['T30','Tríadas','Una tríada básica tiene tres notas separadas por intervalos de tercera. La nota inferior en posición fundamental es la raíz.','Tríada = raíz + tercera + quinta.',4,'¿Cuántas notas tiene una tríada básica?',['2','3','4','5'],1],
  ['T31','Mayor y menor','Las tríadas mayor y menor comparten raíz y quinta, pero cambia la tercera. Esa tercera determina gran parte del color mayor/menor.','Mayor: tercera mayor; menor: tercera menor.',4,'¿Qué nota diferencia principalmente mayor de menor?',['La raíz','La tercera','La quinta','La octava'],1],
  ['T32','Tónica y dominante','La tónica representa reposo y la dominante genera tensión que suele conducir hacia la tónica. Esta relación sostiene muchísima música tonal.','I = reposo; V = tensión.',4,'¿Qué función suele generar más tensión hacia la tónica?',['Tónica','Dominante','Silencio','Octava'],1],
  ['T33','I–IV–V','I, IV y V son funciones fundamentales de la armonía tonal. En Do mayor corresponden a C, F y G.','En Do mayor: I=C, IV=F, V=G.',4,'En Do mayor, ¿cuál es el IV?',['C','D','F','G'],2],
  ['T34','Séptima dominante','El acorde V7 agrega una séptima al dominante y aumenta su tensión hacia I. Es una herramienta central del acompañamiento tonal.','V7 intensifica la resolución hacia I.',4,'¿Qué función tiene V7 respecto de I?',['Reposo absoluto','Tensión y resolución','Cambio de tempo','Silencio'],1]
 ]},
 {id:6,title:'Lectura autónoma',lessons:[
  ['T35','Frases musicales','Una frase musical es una unidad con dirección y sensación de llegada. No leemos solo símbolos: buscamos sentido, respiración y estructura.','La frase tiene dirección, tensión y llegada.',5,'¿Qué buscamos en una frase?',['Solo notas aisladas','Dirección y llegada','Solo digitación','Solo volumen'],1],
  ['T36','Lectura sin ayudas','Retiramos nombres y referencias innecesarias. El objetivo es leer por relaciones, intervalos, ritmo y anticipación.','La ayuda se retira cuando ya no es necesaria.',5,'¿Qué ocurre en lectura autónoma?',['Aparecen más pistas','Se retiran ayudas gradualmente','Se deja de leer ritmo','Se evita la práctica'],1],
  ['T37','Teoría + ritmo','Una partitura se comprende mejor cuando altura y ritmo se leen como un solo sistema. Primero estabilizamos cada variable y luego las unimos.','Altura + tiempo = ejecución comprensible.',5,'¿Qué combinamos?',['Altura y ritmo','Solo volumen','Solo pedal','Solo digitación'],0],
  ['T38','Teoría + frases','Aplicamos intervalos, tonalidad, ritmo y dirección para leer una frase sin depender de nombres nota por nota.','Comprender estructura reduce carga de memoria.',5,'¿Qué reduce la carga de memoria?',['Entender estructura','Mirar más pistas','Tocar más rápido','Ignorar el compás'],0],
  ['T39','Preparación para repertorio','Antes de tocar una pieza completa identificamos tonalidad, compás, patrones, frases y dificultades. Así la práctica deja de ser ensayo ciego.','Analizar antes de ejecutar ahorra repeticiones inútiles.',5,'¿Qué conviene analizar antes de repertorio?',['Solo la primera nota','Tonalidad, compás, patrones y frases','Solo el título','Solo el pedal'],1],
  ['T40','Examen de autonomía','Última comprobación: usar teoría sin depender de una explicación paso a paso. Si aparece una dificultad, sabemos qué concepto revisar.','Autonomía = saber ejecutar y saber diagnosticar.',5,'¿Qué define mejor la autonomía?',['No cometer errores','Saber diagnosticar y corregir','No estudiar teoría','Tocar siempre rápido'],1]
 ]}
];

const THEORY_EXTRA={"1":[["Anatomía de una nota","La posición de la cabeza indica altura; su forma, plica y banderas indican duración. Son dos datos distintos que se leen simultáneamente.","Si la cabeza sube y conserva su figura, ¿qué cambia?",["Altura","Duración","Compás","Volumen"],0],["Líneas adicionales","Las líneas adicionales extienden el pentagrama. Do central se escribe en una línea adicional debajo del pentagrama en clave de Sol; las posiciones continúan alternando línea y espacio.","¿Para qué sirven?",["Cambiar clave","Escribir notas fuera del pentagrama","Indicar silencio","Marcar tempo"],1],["Clave de Fa","La clave de Fa fija el Fa en la cuarta línea desde abajo y se usa para registros graves. Antes de leer, identificá la clave: cambia el nombre asignado a cada posición.","¿Qué nota fija la cuarta línea en clave de Fa?",["Do","Mi","Fa","Sol"],2],["Sistema de piano","La partitura de piano suele unir dos pentagramas: Sol arriba y Fa abajo. La mano derecha suele leer el superior y la izquierda el inferior, aunque las manos pueden cruzarse.","¿Qué clave suele aparecer abajo?",["Sol","Fa","Do","Ninguna"],1],["Octavas y registro","Do4 y Do5 comparten nombre pero están separados por doce semitonos. El número identifica el registro y permite ubicar la tecla exacta.","¿Qué relación hay entre Do4 y Do5?",["Unísono","Octava","Tercera","Quinta"],1],["Cifrado internacional","C D E F G A B representan Do Re Mi Fa Sol La Si. Este código aparece en acordes, tutoriales y partituras modernas.","¿Qué letra representa Sol?",["E","F","G","A"],2],["Lectura por referencias","Elegí notas guía que reconozcas y calculá las demás por pasos o saltos. Si Sol está en la segunda línea, el espacio inmediato superior es La.","¿Qué nota está inmediatamente sobre Sol?",["Fa","La","Si","Do"],1]],"2":[["Subdivisión del pulso","Cada pulso puede dividirse en partes iguales. En subdivisión binaria una negra se divide en dos corcheas. Contar “1 y 2 y” permite ubicar ataques entre pulsos.","¿En qué se divide una negra?",["Dos corcheas","Dos blancas","Cuatro negras","Una redonda"],0],["Semicorcheas","Cuatro semicorcheas ocupan el tiempo de una negra. Contá cuatro partes parejas por pulso y practicá lento antes de acelerar.","¿Cuántas semicorcheas equivalen a una negra?",["2","3","4","8"],2],["Anacrusa","La anacrusa es una entrada incompleta antes del primer compás completo. La melodía comienza antes del acento principal y la duración faltante se compensa en la estructura.","¿Dónde aparece?",["Después del final","Antes del primer compás completo","En cada silencio","Solo en 3/4"],1],["Síncopa","La síncopa desplaza el acento hacia una parte débil o prolonga un sonido desde una parte débil hacia una fuerte. Produce impulso y aparece en pop, jazz, funk y samba.","¿Qué desplaza la síncopa?",["Tonalidad","Acento esperado","Clave","Octava"],1],["Contratiempo","El contratiempo ataca en una parte débil mientras el apoyo fuerte queda en silencio. El sonido normalmente no se prolonga sobre el tiempo fuerte.","¿Dónde cae el ataque típico?",["Parte débil","Primer pulso","Solo al final","Todos los pulsos"],0],["Tresillos","Un tresillo divide en tres partes iguales el espacio que normalmente ocuparían dos unidades. Tres corcheas de tresillo duran lo mismo que dos corcheas regulares.","¿Cuántas notas iguales contiene?",["2","3","4","6"],1],["Tempo y metrónomo","El tempo indica pulsos por minuto. A 60 BPM hay un pulso por segundo; a 120 BPM, dos. Aumentá la velocidad solo cuando el patrón salga parejo.","¿Qué indica 80 BPM?",["80 notas por compás","80 pulsos por minuto","80 compases por segundo","80 semitonos"],1]],"3":[["Tono y semitono","Un semitono es la distancia a la tecla vecina inmediata. Dos semitonos forman un tono. Mi–Fa y Si–Do son semitonos naturales; Do–Re y Re–Mi son tonos.","Mi–Fa naturales forman…",["Un tono","Un semitono","Una tercera","Una octava"],1],["Enarmonía","Do sostenido y Re bemol pueden sonar en la misma tecla del piano temperado, aunque se escriben distinto. La escritura depende de la tonalidad y función.","Do sostenido y Re bemol suelen sonar…",["Distinto registro","Igual","Distinta duración","Como acorde"],1],["Escala menor natural","La menor natural sigue tono–semitono–tono–tono–semitono–tono–tono. En La menor se usan teclas blancas de La a La; La es el centro de reposo.","¿Cuál es el patrón menor natural?",["T-S-T-T-S-T-T","T-T-S-T-T-T-S","S-S-T-T-T-S-T","T-T-T-T-S-S-S"],0],["Escala menor armónica","La menor armónica eleva el séptimo grado para crear una sensible que conduce a la tónica. En La menor, Sol pasa a Sol sostenido.","En La menor armónica se eleva…",["Fa","Sol","La","Mi"],1],["Escala menor melódica","En la forma clásica ascendente, la menor melódica eleva el sexto y séptimo grados. En La menor aparecen Fa sostenido y Sol sostenido.","¿Qué grados se elevan?",["II y III","IV y V","VI y VII","I y V"],2],["Círculo de quintas","El círculo de quintas ordena tonalidades por quintas justas. Hacia la derecha se agrega un sostenido por paso; hacia la izquierda, un bemol.","Desde Do mayor, un paso horario lleva a…",["Fa mayor","Sol mayor","Re mayor","La menor"],1],["Orden de alteraciones","El orden de sostenidos es Fa–Do–Sol–Re–La–Mi–Si. El de bemoles es Si–Mi–La–Re–Sol–Do–Fa.","¿Cuál es el primer sostenido?",["Do♯","Fa♯","Sol♯","Si♭"],1]],"4":[["Intervalo melódico y armónico","El intervalo melódico suena con notas sucesivas; el armónico, con notas simultáneas. La distancia se mide igual, pero cambia la experiencia auditiva.","Do y Mi tocados juntos forman intervalo…",["Melódico","Armónico","Rítmico","Silencioso"],1],["Número y cualidad","El número se calcula contando nombres de nota, incluidos extremos. La cualidad (justo, mayor, menor, aumentado o disminuido) depende de semitonos.","¿Qué define si una tercera es mayor o menor?",["Compás","Semitonos","Digitación","Volumen"],1],["Terceras mayores y menores","Una tercera mayor tiene cuatro semitonos; una menor, tres. Do–Mi es mayor y Do–Mi bemol es menor. Tocá ambas para escuchar el cambio.","¿Cuántos semitonos tiene una tercera menor?",["2","3","4","5"],1],["Quinta justa y tritono","La quinta justa tiene siete semitonos. El tritono tiene seis y divide la octava en dos mitades iguales. Es una tensión característica de acordes dominantes.","¿Cuántos semitonos tiene el tritono?",["5","6","7","8"],1],["Inversión de intervalos","Al invertir un intervalo, una nota pasa una octava. Los números se complementan a nueve: segunda-séptima, tercera-sexta, cuarta-quinta.","¿Cuál es la inversión de una tercera?",["Segunda","Cuarta","Sexta","Séptima"],2],["Reconocimiento auditivo","Cantá una nota de partida, imaginá la segunda y verificá tocando ambas. El objetivo es reconocer la distancia, no adivinar una canción.","¿Cómo verificás un intervalo oído?",["Adivinar","Cantarlo y tocarlo desde una referencia","Mirar volumen","Cambiar tempo"],1],["Contorno melódico","El contorno indica si la melodía sube, baja, repite o salta. Antes de nombrar todas las notas, observá su trayectoria.","¿Qué describe el contorno?",["Duración","Trayectoria de alturas","Marca del piano","Volumen"],1]],"5":[["Tríada mayor","La tríada mayor se construye con raíz, tercera mayor y quinta justa. Desde Do: Do–Mi–Sol. Su estructura es 0–4–7 semitonos desde la raíz.","¿Qué estructura tiene una tríada mayor?",["0–3–7","0–4–7","0–3–6","0–4–8"],1],["Tríada menor","La tríada menor tiene raíz, tercera menor y quinta justa. Desde La: La–Do–Mi. Comparada con la mayor, baja un semitono la tercera.","¿Qué estructura tiene una tríada menor?",["0–4–7","0–3–7","0–3–6","0–4–8"],1],["Acordes disminuidos y aumentados","La tríada disminuida tiene estructura 0–3–6; la aumentada, 0–4–8. La quinta alterada cambia el color y la tensión.","¿Qué estructura corresponde al disminuido?",["0–4–7","0–3–7","0–3–6","0–4–8"],2],["Inversiones de acordes","En posición fundamental la raíz queda en el bajo. En primera inversión queda la tercera; en segunda, la quinta. Las notas no cambian, pero sí el bajo.","¿Qué nota queda abajo en primera inversión?",["Raíz","Tercera","Quinta","Séptima"],1],["Acordes de séptima","Un acorde de séptima agrega una séptima a la tríada. Puede ser mayor séptima, dominante, menor séptima o semidisminuido.","¿Cuántas notas tiene un acorde de séptima básico?",["2","3","4","5"],2],["Progresiones armónicas","Una progresión es una sucesión organizada de acordes. En Do mayor, C–F–G–C equivale a I–IV–V–I: salida, tensión y regreso.","En Do mayor, ¿qué acorde es V?",["C","Dm","G","Am"],2],["Cifrado americano","C indica Do mayor; Cm, Do menor; C7, Do séptima dominante; Cmaj7, Do mayor séptima. La barra indica un bajo distinto, como C/E.","¿Qué significa Cm?",["Do mayor","Do menor","Do dominante","Do aumentado"],1]],"6":[["Forma musical","La forma organiza secciones como introducción, estrofa, estribillo, puente y cierre. Reconocer repeticiones y contrastes permite anticipar estructura y memorizar por bloques.","¿Qué ayuda a reconocer la forma?",["Primera nota","Secciones, repeticiones y contrastes","Marca del instrumento","Volumen"],1],["Motivo y desarrollo","Un motivo es una idea breve y reconocible, rítmica, melódica o ambas. Puede repetirse, variarse, invertirse o desplazarse. Detectarlo reduce material para memorizar.","¿Qué es un motivo?",["Canción completa","Idea breve reconocible","Pedal","Clave"],1],["Dinámica y articulación","La dinámica indica intensidad (p, mf, f, crescendo). La articulación indica cómo se atacan y conectan las notas (legato, staccato, acentos).","¿Qué significa staccato?",["Notas cortas y separadas","Aumentar volumen","Acelerar","Usar pedal"],0],["Ligaduras y fraseo","La ligadura de expresión agrupa notas en una frase; la de prolongación une notas de igual altura y suma duraciones. Distinguirlas evita errores de lectura.","¿Cuál suma duraciones?",["Expresión","Prolongación","Compás","Octava"],1],["Pedal de sustain","El pedal derecho prolonga la resonancia. Cambialo al cambiar la armonía para evitar que acordes diferentes se mezclen. Primero practicá sin pedal.","¿Cuándo conviene cambiarlo?",["Nunca","Al cambiar la armonía","En cada nota","Solo al final"],1],["Lectura a primera vista","Antes de tocar, revisá clave, armadura, compás, tempo, patrones y zonas difíciles. Mirá un poco por delante y mantené el pulso aunque aparezca un error.","¿Qué revisás antes de leer?",["Título","Clave, armadura, compás y patrones","Última nota","Color del teclado"],1],["Memoria musical por capas","Construí memoria auditiva, visual, estructural y motora. Aprendé forma y armonía, luego frases, ritmo y digitación. Alterná tocar de memoria con revisar la partitura.","¿Qué estrategia es más estable?",["Repetir sin pensar","Memorizar por capas y verificar","Tocar más rápido","No escuchar"],1],["Diagnóstico de errores","Identificá si el problema es altura, ritmo, digitación, coordinación, lectura o memoria. Aislá dos compases y una variable, corregila lento y reintegrala.","¿Qué hacés primero ante un error repetido?",["Acelerar","Identificar qué variable falla","Reiniciar siempre","Cambiar canción"],1],["Autonomía interpretativa","Ser autónomo no significa no equivocarse: significa comprender la pieza, elegir cómo estudiarla, escuchar el resultado y corregirse. Definí un objetivo, grabá y elegí una mejora concreta.","¿Qué demuestra autonomía?",["No equivocarse nunca","Saber estudiar y corregirse","Tocar solo de memoria","Evitar piezas nuevas"],1]]};

const THEORY_FINAL=[
[3,['Escala cromática','La escala cromática recorre todas las doce alturas de la octava mediante semitonos. En el piano se tocan todas las teclas, blancas y negras, en orden. Puede escribirse con sostenidos al ascender y bemoles al descender, según el contexto.','¿Cuántas alturas distintas reúne la escala cromática antes de repetir la octava?',['7','8','10','12'],3,'Tocá Do–Do♯–Re–Re♯–Mi y continuá hasta el Do siguiente, nombrando cada tecla.']],
[3,['Tonalidades relativas','Una tonalidad mayor y su relativa menor comparten la misma armadura, pero tienen distinta tónica. Do mayor y La menor, por ejemplo, usan las mismas notas naturales. Para reconocer la relativa menor, descendé una tercera menor desde la tónica mayor.','¿Cuál es la relativa menor de Do mayor?',['Mi menor','La menor','Re menor','Sol menor'],1,'Tocá Do mayor y luego La menor usando solo teclas blancas. Escuchá cómo cambia el centro de reposo.']],
[4,['Movimiento conjunto y disjunto','El movimiento conjunto avanza a la nota vecina de la escala; el disjunto salta una o más posiciones. Una melodía combina ambos para crear fluidez y variedad. Reconocer el tipo de movimiento ayuda a anticipar la digitación y la lectura.','¿Qué caracteriza al movimiento conjunto?',['Un salto amplio','Avanzar a la nota vecina','Tocar dos notas juntas','Repetir el mismo sonido'],1,'Tocá Do–Re–Mi como movimiento conjunto y Do–Sol como movimiento disjunto. Compará la sensación de cada uno.']],
[4,['Intervalos compuestos','Un intervalo compuesto supera la octava. Se obtiene al sumar una octava a un intervalo simple: una novena equivale a una octava más una segunda. Para reconocerlo, identificá primero la octava y luego la distancia adicional.','¿Qué contiene una novena?',['Una octava y una segunda','Dos terceras','Una quinta y una sexta','Dos octavas'],0,'Tocá Do4–Re5. Identificá la octava y el tono adicional que forma la novena.']],
[5,['Función subdominante','La función subdominante (IV o ii en tonalidad mayor) suele alejarse de la tónica y preparar el movimiento hacia la dominante. En Do mayor, Fa (IV) abre el movimiento que puede conducir a Sol (V) y volver a Do (I).','En Do mayor, ¿qué acorde representa IV?',['Do','Re menor','Fa','Sol'],2,'Tocá C–F–G–C y escuchá el papel de Fa como preparación antes de la dominante.']],
[5,['Acordes diatónicos','Los acordes diatónicos se construyen usando únicamente las notas de una escala. En Do mayor: C, Dm, Em, F, G, Am y Bdim. Cada grado produce una tríada de calidad distinta según la combinación de terceras.','¿Qué acorde del campo armónico de Do mayor es menor?',['C','F','G','Am'],3,'Construí las tríadas sobre Do, Re y Mi usando solo teclas blancas. Identificá mayor o menor por sus terceras.']]
];

async function restoreProgressIndexedDB(){

   let tx;try{tx=db.transaction('progress','readonly');const req=tx.objectStore('progress').get('current');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('No se pudo leer respaldo'))}catch(e){reject(e)}
  });

  const saved=normalizeState(JSON.parse(record.snapshot));
  const before=progressScore(state);
  const merged=mergeProgressStates(state,saved);
  const changed=JSON.stringify(merged)!==JSON.stringify(state);
  if(changed){

   renderSide();if(document.getElementById('main'))show(activeView||'home');

  }
  return {ok:true,restored:changed,completed:Object.values(state.lessons||{}).filter(Boolean).length,scoreBefore:before,scoreAfter:progressScore(state)};
 }catch(e){console.warn('[Autonomía Piano] No se pudo leer respaldo IndexedDB',e);return {ok:false,error:String(e)}}
}

,["Lenguaje musical: fundamentos","Linguagem musical: fundamentos"],["Tonos y semitonos","Tons e semitons"],["Escalas y alteraciones","Escalas e alterações"],["Intervalos y grados","Intervalos e graus"],["El semitono","O semitom"],["El tono","O tom"],["Reconocer distancias","Reconhecer distâncias"],["Escala mayor","Escala maior"],["Construir una escala mayor","Construir uma escala maior"],["Escala menor natural","Escala menor natural"],["Sostenido y bemol","Sustenido e bemol"],["Becuadro","Bequadro"],["Enarmonía","Enarmonia"],["Intervalo: segunda","Intervalo: segunda"],["Intervalo: tercera","Intervalo: terça"],["Intervalo: quinta justa","Intervalo: quinta justa"],["Grados de la escala","Graus da escala"],["Tónica y dominante","Tônica e dominante"],["Aplicación: leer una escala","Aplicação: ler uma escala"],["El semitono es la distancia más pequeña del sistema tonal habitual: entre dos teclas contiguas del piano, sin saltar ninguna. Puede ser entre dos teclas blancas o entre una blanca y una negra.","O semitom é a menor distância do sistema tonal habitual: entre duas teclas vizinhas do piano, sem pular nenhuma. Pode ocorrer entre duas teclas brancas ou entre uma branca e uma preta."],["Mi–Fa y Si–Do son semitonos naturales: no hay tecla negra entre ellas.","Mi–Fá e Si–Dó são semitons naturais: não há tecla preta entre elas."],["¿Qué distancia hay entre Mi y Fa?","Qual é a distância entre Mi e Fá?"],["Un semitono","Um semitom"],["Un tono","Um tom"],["Una tercera","Uma terça"],["Correcto: Mi y Fa son teclas blancas contiguas. Entre ellas hay un semitono.","Correto: Mi e Fá são teclas brancas vizinhas. Entre elas há um semitom."],["Un tono equivale a dos semitonos. En el teclado se avanza dos teclas contiguas contando blancas y negras.","Um tom equivale a dois semitons. No teclado, avançamos duas teclas vizinhas, contando brancas e pretas."],["Do–Re contiene Do♯/Re♭ en el medio: dos semitonos.","Dó–Ré contém Dó♯/Ré♭ no meio: dois semitons."],["¿Cuántos semitonos forman un tono?","Quantos semitons formam um tom?"],["Dos","Dois"],["Tres","Três"],["Correcto: un tono está formado por dos semitonos.","Correto: um tom é formado por dois semitons."],["Para medir una distancia, contá los semitonos entre la nota inicial y la final. No cuentes la tecla inicial como un paso.","Para medir uma distância, conte os semitons entre a nota inicial e a final. Não conte a tecla inicial como um passo."],["Do–Mi: Do→Do♯ (1), Do♯→Re (2), Re→Re♯ (3), Re♯→Mi (4).","Dó–Mi: Dó→Dó♯ (1), Dó♯→Ré (2), Ré→Ré♯ (3), Ré♯→Mi (4)."],["¿Cuántos semitonos hay de Do a Mi?","Quantos semitons há de Dó a Mi?"],["Correcto: Do–Mi tiene cuatro semitonos; es una tercera mayor.","Correto: Dó–Mi tem quatro semitons; é uma terça maior."],["La escala mayor sigue este patrón de distancias: tono, tono, semitono, tono, tono, tono, semitono (T–T–S–T–T–T–S).","A escala maior segue este padrão de distâncias: tom, tom, semitom, tom, tom, tom, semitom (T–T–S–T–T–T–S)."],["Do mayor: Do–Re–Mi–Fa–Sol–La–Si–Do.","Dó maior: Dó–Ré–Mi–Fá–Sol–Lá–Si–Dó."],["¿Entre qué grados aparece el primer semitono de Do mayor?","Entre quais graus aparece o primeiro semitom de Dó maior?"],["Do–Re","Dó–Ré"],["Mi–Fa","Mi–Fá"],["Sol–La","Sol–Lá"],["Correcto: en Do mayor, el primer semitono está entre el tercer y cuarto grado: Mi–Fa.","Correto: em Dó maior, o primeiro semitom está entre o terceiro e o quarto grau: Mi–Fá."],["Para construir una escala mayor desde cualquier nota, respetá el patrón T–T–S–T–T–T–S. Algunas notas deberán alterarse para conservar esas distancias.","Para construir uma escala maior a partir de qualquer nota, respeite o padrão T–T–S–T–T–T–S. Algumas notas precisarão ser alteradas para manter essas distâncias."],["Sol mayor: Sol–La–Si–Do–Re–Mi–Fa♯–Sol.","Sol maior: Sol–Lá–Si–Dó–Ré–Mi–Fá♯–Sol."],["¿Qué nota se altera en Sol mayor?","Qual nota é alterada em Sol maior?"],["Fa♯","Fá♯"],["Do♯","Dó♯"],["Si♭","Si♭"],["Correcto: Fa debe subir un semitono para mantener el patrón de Sol mayor.","Correto: Fá precisa subir um semitom para manter o padrão de Sol maior."],["La escala menor natural usa el patrón T–S–T–T–S–T–T. Su tercer grado está a una tercera menor de la tónica.","A escala menor natural usa o padrão T–S–T–T–S–T–T. Seu terceiro grau está a uma terça menor da tônica."],["La menor natural: La–Si–Do–Re–Mi–Fa–Sol–La.","Lá menor natural: Lá–Si–Dó–Ré–Mi–Fá–Sol–Lá."],["¿Cuál es el patrón de la escala menor natural?","Qual é o padrão da escala menor natural?"],["T–T–S–T–T–T–S","T–T–S–T–T–T–S"],["T–S–T–T–S–T–T","T–S–T–T–S–T–T"],["S–T–T–T–S–T–T","S–T–T–T–S–T–T"],["Correcto: La menor natural sigue T–S–T–T–S–T–T.","Correto: Lá menor natural segue T–S–T–T–S–T–T."],["El sostenido (♯) eleva una nota un semitono. El bemol (♭) la baja un semitono. No son nombres de teclas: describen cómo se modifica una nota.","O sustenido (♯) eleva uma nota em um semitom. O bemol (♭) abaixa uma nota em um semitom. Não são nomes de teclas: descrevem como uma nota é modificada."],["Do♯ suena un semitono por encima de Do; Re♭, uno por debajo de Re.","Dó♯ soa um semitom acima de Dó; Ré♭, um abaixo de Ré."],["¿Qué hace un bemol?","O que faz um bemol?"],["Sube un semitono","Sobe um semitom"],["Baja un semitono","Desce um semitom"],["Sube un tono","Sobe um tom"],["Correcto: el bemol baja la nota un semitono.","Correto: o bemol abaixa a nota em um semitom."],["El becuadro (♮) cancela una alteración previa y devuelve la nota a su altura natural dentro del compás, según las reglas de escritura.","O bequadro (♮) cancela uma alteração anterior e devolve a nota à sua altura natural dentro do compasso, conforme as regras de escrita."],["Si aparece Fa♯ y luego Fa♮ en el mismo compás, el segundo Fa vuelve a la tecla Fa natural.","Se aparecer Fá♯ e depois Fá♮ no mesmo compasso, o segundo Fá volta à tecla Fá natural."],["¿Qué función cumple el becuadro?","Qual é a função do bequadro?"],["Cancela una alteración","Cancela uma alteração"],["Duplica la duración","Duplica a duração"],["Sube dos semitonos","Sobe dois semitons"],["Correcto: el becuadro anula el sostenido o bemol que afectaba esa nota.","Correto: o bequadro anula o sustenido ou bemol que afetava aquela nota."],["Dos notas pueden escribirse de forma diferente y sonar igual en el piano afinado en temperamento igual. Se llaman enarmónicas.","Duas notas podem ser escritas de formas diferentes e soar iguais no piano afinado em temperamento igual. Elas são chamadas enarmônicas."],["Do♯ y Re♭ comparten tecla y altura sonora, aunque su escritura y función pueden diferir.","Dó♯ e Ré♭ compartilham a mesma tecla e altura sonora, embora a escrita e a função possam ser diferentes."],["¿Qué pareja es enarmónica?","Qual par é enarmônico?"],["Do–Re","Dó–Ré"],["Do♯–Re♭","Dó♯–Ré♭"],["Mi–Fa","Mi–Fá"],["Correcto: Do sostenido y Re bemol suenan igual en el piano.","Correto: Dó sustenido e Ré bemol soam iguais no piano."],["Los intervalos nombran la distancia entre dos notas. La segunda abarca dos nombres de nota consecutivos, como Do–Re; puede ser mayor o menor.","Os intervalos nomeiam a distância entre duas notas. A segunda abrange dois nomes consecutivos, como Dó–Ré; pode ser maior ou menor."],["Do–Re es segunda mayor; Mi–Fa es segunda menor.","Dó–Ré é segunda maior; Mi–Fá é segunda menor."],["¿Qué intervalo forman Do y Re?","Qual intervalo é formado por Dó e Ré?"],["Segunda","Segunda"],["Tercera","Terça"],["Quinta","Quinta"],["Correcto: Do y Re son nombres consecutivos: forman una segunda.","Correto: Dó e Ré são nomes consecutivos: formam uma segunda."],["Una tercera abarca tres nombres de nota contando inicio y final: Do–Re–Mi. Puede ser mayor (4 semitonos) o menor (3 semitonos).","Uma terça abrange três nomes de notas, contando o início e o fim: Dó–Ré–Mi. Pode ser maior (4 semitons) ou menor (3 semitons)."],["Do–Mi = tercera mayor; Do–Mi♭ = tercera menor.","Dó–Mi = terça maior; Dó–Mi♭ = terça menor."],["¿Cuántos semitonos tiene una tercera menor?","Quantos semitons tem uma terça menor?"],["Correcto: la tercera menor tiene tres semitonos.","Correto: a terça menor tem três semitons."],["La quinta abarca cinco nombres de nota. La quinta justa contiene siete semitonos y es una referencia importante para construir acordes.","A quinta abrange cinco nomes de notas. A quinta justa contém sete semitons e é uma referência importante para construir acordes."],["Do–Sol: Do–Re–Mi–Fa–Sol, siete semitonos.","Dó–Sol: Dó–Ré–Mi–Fá–Sol, sete semitons."],["¿Cuántos semitonos tiene una quinta justa?","Quantos semitons tem uma quinta justa?"],["Correcto: la quinta justa equivale a siete semitonos.","Correto: a quinta justa equivale a sete semitons."],["Cada nota de una escala tiene un número o grado. En Do mayor: Do es I (tónica), Re II, Mi III, Fa IV, Sol V (dominante), La VI y Si VII (sensible).","Cada nota de uma escala tem um número ou grau. Em Dó maior: Dó é I (tônica), Ré II, Mi III, Fá IV, Sol V (dominante), Lá VI e Si VII (sensível)."],["El grado I da sensación de reposo; el V suele generar tensión que busca volver al I.","O grau I transmite sensação de repouso; o V costuma gerar tensão e buscar o retorno ao I."],["En Do mayor, ¿qué grado es Sol?","Em Dó maior, qual é o grau de Sol?"],["Correcto: Sol es el quinto grado de Do mayor: la dominante.","Correto: Sol é o quinto grau de Dó maior: a dominante."],["La tónica (I) es el centro de reposo tonal. La dominante (V) crea tensión y suele conducir de vuelta a la tónica.","A tônica (I) é o centro de repouso tonal. A dominante (V) cria tensão e geralmente conduz de volta à tônica."],["En Do mayor, el movimiento Sol–Do (V–I) produce una resolución muy reconocible.","Em Dó maior, o movimento Sol–Dó (V–I) produz uma resolução muito reconhecível."],["En Do mayor, ¿cuál es la dominante?","Em Dó maior, qual é a dominante?"],["&gt;Fa&lt;","&gt;Fá&lt;"],["Sol","Sol"],["Correcto: Sol es el quinto grado y funciona como dominante.","Correto: Sol é o quinto grau e funciona como dominante."],["Para analizar una escala, identificá su tónica, escribí los siete grados y verificá el patrón de tonos y semitonos. No alcanza con memorizar la digitación.","Para analisar uma escala, identifique sua tônica, escreva os sete graus e verifique o padrão de tons e semitons. Não basta memorizar a digitação."],["Re mayor: Re–Mi–Fa♯–Sol–La–Si–Do♯–Re. Sus alteraciones son Fa♯ y Do♯.","Ré maior: Ré–Mi–Fá♯–Sol–Lá–Si–Dó♯–Ré. Suas alterações são Fá♯ e Dó♯."],["¿Qué dos notas llevan sostenido en Re mayor?","Quais duas notas têm sustenido em Ré maior?"],["Fa y Do","Fá e Dó"],["Sol y Re","Sol e Ré"],["Mi y La","Mi e Lá"],["Correcto: Re mayor tiene dos sostenidos: Fa♯ y Do♯.","Correto: Ré maior tem dois sustenidos: Fá♯ e Dó♯."],["COMPRENDER ANTES DE RESPONDER","COMPREENDER ANTES DE RESPONDER"],["Elegí una respuesta. La explicación de corrección aparecerá después.","Escolha uma resposta. A explicação da correção aparecerá depois."],["Todavía no.","Ainda não."],["Volvé a leer la explicación y reintentá.","Leia novamente a explicação e tente outra vez."],["Concepto comprendido.","Conceito compreendido."],["Explorá el concepto en el piano","Explore o conceito no piano"],["Tocá las notas del ejemplo en el teclado. Escuchá la distancia y compará las teclas blancas y negras antes de responder.","Toque as notas do exemplo no teclado. Ouça a distância e compare as teclas brancas e pretas antes de responder."],["Qué es una tríada","O que é uma tríade"],["Tríada mayor","Tríade maior"],["Tríada menor","Tríade menor"],["Tríada disminuida","Tríade diminuta"],["Fundamental y nombre del acorde","Fundamental e nome do acorde"],["Estado fundamental","Estado fundamental"],["Primera inversión","Primeira inversão"],["Segunda inversión","Segunda inversão"],["Cifrado mayor y menor","Cifragem maior e menor"],["Acordes de una escala mayor","Acordes de uma escala maior"],["Tónica: función de reposo","Tônica: função de repouso"],["Subdominante: preparación","Subdominante: preparação"],["Dominante: tensión","Dominante: tensão"],["Cadencia V–I","Cadência V–I"],["Conducción de voces","Condução de vozes"],["Una tríada es un acorde de tres notas distintas organizadas por terceras: fundamental, tercera y quinta. Se puede tocar en distintas octavas y seguir siendo el mismo acorde.","Uma tríade é um acorde de três notas diferentes organizadas em terças: fundamental, terça e quinta. Ela pode ser tocada em oitavas diferentes e continuar sendo o mesmo acorde."],["Do–Mi–Sol: fundamental Do, tercera Mi y quinta Sol.","Dó–Mi–Sol: fundamental Dó, terça Mi e quinta Sol."],["¿Qué notas forman la estructura básica de una tríada?","Quais notas formam a estrutura básica de uma tríade?"],["Fundamental, tercera y quinta","Fundamental, terça e quinta"],["Fundamental, cuarta y sexta","Fundamental, quarta e sexta"],["Tres notas consecutivas","Três notas consecutivas"],["La tríada mayor tiene una tercera mayor desde la fundamental (4 semitonos) y una tercera menor desde la tercera hasta la quinta (3 semitonos).","A tríade maior tem uma terça maior a partir da fundamental (4 semitons) e uma terça menor da terça até a quinta (3 semitons)."],["Do mayor: Do–Mi–Sol (4 + 3 semitonos).","Dó maior: Dó–Mi–Sol (4 + 3 semitons)."],["¿Cuál es la estructura en semitonos de una tríada mayor?","Qual é a estrutura em semitons de uma tríade maior?"],["La tríada mayor tiene 4 semitonos y luego 3.","A tríade maior tem 4 semitons e depois 3."],["La tríada menor invierte las distancias: tercera menor desde la fundamental y tercera mayor hasta la quinta.","A tríade menor inverte as distâncias: terça menor a partir da fundamental e terça maior até a quinta."],["La menor: La–Do–Mi (3 + 4 semitonos).","Lá menor: Lá–Dó–Mi (3 + 4 semitons)."],["¿Cuál es la estructura de una tríada menor?","Qual é a estrutura de uma tríade menor?"],["La tríada menor tiene 3 semitonos y luego 4.","A tríade menor tem 3 semitons e depois 4."],["La tríada disminuida contiene dos terceras menores superpuestas. Su quinta queda disminuida y produce una sonoridad inestable.","A tríade diminuta contém duas terças menores sobrepostas. Sua quinta fica diminuta e produz uma sonoridade instável."],["Si disminuido: Si–Re–Fa (3 + 3 semitonos).","Si diminuto: Si–Ré–Fá (3 + 3 semitons)."],["¿Qué distancias forman una tríada disminuida?","Quais distâncias formam uma tríade diminuta?"],["La tríada disminuida se construye con dos terceras menores: 3 + 3.","A tríade diminuta é construída com duas terças menores: 3 + 3."],["La fundamental es la nota que da nombre al acorde. En Do mayor, Do es la fundamental aunque las notas aparezcan en otro orden o en otras octavas.","A fundamental é a nota que dá nome ao acorde. Em Dó maior, Dó é a fundamental mesmo que as notas apareçam em outra ordem ou em outras oitavas."],["Mi–Sol–Do sigue siendo Do mayor: las notas son las mismas, pero están invertidas.","Mi–Sol–Dó continua sendo Dó maior: as notas são as mesmas, mas estão invertidas."],["En Sol–Do–Mi, ¿cuál es la fundamental del acorde?","Em Sol–Dó–Mi, qual é a fundamental do acorde?"],["Sol","Sol"],["&gt;Do&lt;","&gt;Dó&lt;"],["Mi","Mi"],["Las notas Sol–Do–Mi forman Do mayor en primera inversión; Do es la fundamental.","As notas Sol–Dó–Mi formam Dó maior na primeira inversão; Dó é a fundamental."],["Un acorde está en estado fundamental cuando su fundamental es la nota más grave. Las otras notas se apilan por encima.","Um acorde está no estado fundamental quando sua fundamental é a nota mais grave. As outras notas ficam acima dela."],["Do–Mi–Sol, con Do en el bajo.","Dó–Mi–Sol, com Dó no baixo."],["¿Qué nota debe estar en el bajo en el estado fundamental de Do mayor?","Qual nota deve estar no baixo no estado fundamental de Dó maior?"],["En estado fundamental, la fundamental Do ocupa el bajo.","No estado fundamental, a fundamental Dó ocupa o baixo."],["En primera inversión, la tercera del acorde pasa al bajo. El acorde conserva sus notas y su identidad, pero cambia la disposición.","Na primeira inversão, a terça do acorde passa para o baixo. O acorde mantém suas notas e identidade, mas muda a disposição."],["Do mayor: Mi–Sol–Do.","Dó maior: Mi–Sol–Dó."],["¿Qué nota queda en el bajo en la primera inversión de Do mayor?","Qual nota fica no baixo na primeira inversão de Dó maior?"],["La tercera Mi pasa al bajo en la primera inversión.","A terça Mi passa para o baixo na primeira inversão."],["En segunda inversión, la quinta del acorde queda en el bajo. La fundamental y la tercera quedan por encima.","Na segunda inversão, a quinta do acorde fica no baixo. A fundamental e a terça ficam acima."],["Do mayor: Sol–Do–Mi.","Dó maior: Sol–Dó–Mi."],["¿Qué nota queda en el bajo en la segunda inversión de Do mayor?","Qual nota fica no baixo na segunda inversão?"],["La quinta Sol queda en el bajo en segunda inversión.","A quinta Sol fica no baixo na segunda inversão."],["En cifrado americano, una letra sola suele indicar acorde mayor; la letra seguida de m indica menor.","Na cifra americana, uma letra sozinha geralmente indica acorde maior; a letra seguida de m indica menor."],["C = Do mayor. Cm = Do menor. Am = La menor.","C = Dó maior. Cm = Dó menor. Am = Lá menor."],["¿Qué significa Am?","O que significa Am?"],["La mayor","Lá maior"],["La menor","Lá menor"],["La disminuida","Lá diminuta"],["La m minúscula indica acorde menor: Am es La menor.","O m minúsculo indica acorde menor: Am é Lá menor."],["Al armonizar una escala mayor apilando terceras diatónicas, aparecen tríadas mayores en I, IV y V; menores en II, III y VI; y disminuida en VII.","Ao harmonizar uma escala maior empilhando terças diatônicas, surgem tríades maiores em I, IV e V; menores em II, III e VI; e diminuta em VII."],["En Do mayor: C, Dm, Em, F, G, Am, Bdim.","Em Dó maior: C, Dm, Em, F, G, Am, Bdim."],["¿Qué calidad tiene el acorde construido sobre el quinto grado de una escala mayor?","Qual é a qualidade do acorde construído sobre o quinto grau de uma escala maior?"],["Mayor","Maior"],["Menor","Menor"],["Disminuido","Diminuto"],["El quinto grado de una escala mayor forma una tríada mayor.","O quinto grau de uma escala maior forma uma tríade maior."],["La función de tónica representa estabilidad y reposo. El acorde I suele sentirse como punto de llegada y centro tonal.","A função de tônica representa estabilidade e repouso. O acorde I geralmente é sentido como ponto de chegada e centro tonal."],["En Do mayor, C es el acorde I y cumple función de tónica.","Em Dó maior, C é o acorde I e exerce a função de tônica."],["¿Qué función cumple el acorde I?","Qual função o acorde I exerce?"],["Tónica","Tônica"],["El grado I es la tónica, el centro de reposo.","O grau I é a tônica, o centro de repouso."],["La función subdominante suele alejarse del reposo de la tónica y preparar el movimiento hacia la dominante.","A função subdominante geralmente se afasta do repouso da tônica e prepara o movimento em direção à dominante."],["En Do mayor, F (IV) suele conducir hacia G (V).","Em Dó maior, F (IV) geralmente conduz a G (V)."],["En Do mayor, ¿qué acorde representa el IV?","Em Dó maior, qual acorde representa o IV?"],["F es el cuarto grado y cumple función subdominante.","F é o quarto grau e exerce a função subdominante."],["La dominante (V) genera tensión que suele resolver en la tónica (I). En música tonal, esta relación organiza muchísimas cadencias.","A dominante (V) gera tensão que geralmente se resolve na tônica (I). Na música tonal, essa relação organiza muitas cadências."],["En Do mayor: G → C (V–I).","Em Dó maior: G → C (V–I)."],["¿Qué acorde es la dominante en Do mayor?","Qual acorde é a dominante em Dó maior?"],["G es el quinto grado de Do mayor y funciona como dominante.","G é o quinto grau de Dó maior e funciona como dominante."],["La cadencia auténtica V–I conduce desde la dominante a la tónica. Es una de las resoluciones más fuertes de la armonía tonal.","A cadência autêntica V–I conduz da dominante à tônica. É uma das resoluções mais fortes da harmonia tonal."],["G–C: Sol mayor resuelve en Do mayor.","G–C: Sol maior resolve em Dó maior."],["¿Qué progresión representa una cadencia V–I en Do mayor?","Qual progressão representa uma cadência V–I em Dó maior?"],["C–F","C–F"],["F–G","F–G"],["G–C","G–C"],["G–C es dominante–tónica (V–I) en Do mayor.","G–C é dominante–tônica (V–I) em Dó maior."],["Una buena conducción de voces busca que cada nota se mueva lo mínimo posible entre acordes, evitando saltos innecesarios y manteniendo notas comunes cuando conviene.","Uma boa condução de vozes busca que cada nota se mova o mínimo possível entre acordes, evitando saltos desnecessários e mantendo notas comuns quando conveniente."],["Al pasar de C (C–E–G) a Am (A–C–E), Do y Mi pueden mantenerse; Sol baja a La.","Ao passar de C (C–E–G) para Am (A–C–E), Dó e Mi podem permanecer; Sol desce para Lá."],["¿Qué busca principalmente una conducción de voces fluida?","O que uma condução de vozes fluida busca principalmente?"],["Mover todas las notas lo máximo posible","Mover todas as notas o máximo possível"],["Reducir movimientos innecesarios y conservar notas comunes","Reduzir movimentos desnecessários e conservar notas comuns"],["Cambiar siempre de octava","Sempre mudar de oitava"],["La conducción fluida minimiza movimientos y aprovecha notas comunes.","A condução fluida minimiza movimentos e aproveita notas comuns."],["Respondé la pregunta para habilitar la evaluación práctica.","Responda à pergunta para habilitar a avaliação prática."],["Tocá las tres notas de cada acorde, juntas y dentro de una ventana breve. Podés usar distintas octavas. Después comprobá el orden.","Toque as três notas de cada acorde juntas e dentro de um intervalo curto. Você pode usar oitavas diferentes. Depois confira a ordem."],["Primero respondé correctamente la pregunta de teoría.","Primeiro responda corretamente à pergunta de teoria."],["Ahora formá la progresión en el teclado.","Agora forme a progressão no teclado."],["Todavía no.","Ainda não."],["Estudiá el concepto, observá el ejemplo y resolvé una comprobación concreta antes de avanzar.","Estude o conceito, observe o exemplo e responda a uma verificação concreta antes de avançar."],["Construcción de tríadas","Construção de tríades"],["Raíz y calidad del acorde","Fundamental e qualidade do acorde"],["Progresión armónica","Progressão harmônica"],["Cambios con pulso","Trocas no pulso"],["Acordes en contexto","Acordes em contexto"],["Formá cada tríada, escuchá su calidad y enlazá los acordes sin perder el pulso. La evaluación comprueba las notas y el orden de la progresión.","Forme cada tríade, ouça sua sonoridade e conecte os acordes sem perder a pulsação. A avaliação verifica as notas e a ordem da progressão."],["El pentagrama","A pauta musical"],["Clave de Sol","Clave de Sol"],["Notas en las líneas","Notas nas linhas"],["Notas en los espacios","Notas nos espaços"],["Dirección y altura","Direção e altura"],["Líneas adicionales","Linhas suplementares"],["Do central y teclado","Dó central e teclado"],["Octavas","Oitavas"],["Figuras y duración","Figuras e duração"],["Corcheas","Colcheias"],["Silencios","Pausas"],["Compás y 4/4","Compasso e 4/4"],["Barra de compás","Barra de compasso"],["Sostenidos y bemoles en la lectura","Sustenidos e bemóis na leitura"],["Armadura y alteración accidental","Armadura e acidente musical"],["El pentagrama tiene cinco líneas horizontales y cuatro espacios. Las notas se escriben sobre una línea o dentro de un espacio; la posición vertical indica su altura.","A pauta musical tem cinco linhas horizontais e quatro espaços. As notas são escritas sobre uma linha ou dentro de um espaço; a posição vertical indica sua altura."],["Se cuentan las líneas desde abajo hacia arriba: primera, segunda, tercera, cuarta y quinta.","As linhas são contadas de baixo para cima: primeira, segunda, terceira, quarta e quinta."],["¿Cuántas líneas tiene el pentagrama?","Quantas linhas tem a pauta musical?"],["Cuatro","Quatro"],["Cinco","Cinco"],["Seis","Seis"],["El pentagrama tiene cinco líneas y cuatro espacios.","A pauta musical tem cinco linhas e quatro espaços."],["La clave de Sol indica dónde se escribe la nota Sol. Su espiral rodea la segunda línea contando desde abajo; esa línea es Sol4.","A clave de Sol indica onde a nota Sol é escrita. Sua espiral envolve a segunda linha contando de baixo; essa linha é Sol4."],["En clave de Sol, la segunda línea desde abajo corresponde a Sol4.","Na clave de Sol, a segunda linha de baixo corresponde a Sol4."],["¿En qué línea se ubica Sol en clave de Sol?","Em qual linha fica Sol na clave de Sol?"],["Primera línea","Primeira linha"],["Segunda línea","Segunda linha"],["Quinta línea","Quinta linha"],["La clave de Sol fija Sol en la segunda línea desde abajo.","A clave de Sol fixa Sol na segunda linha de baixo."],["En clave de Sol, las cinco líneas desde abajo son Mi–Sol–Si–Re–Fa. Recordar esta secuencia ayuda a leer sin contar desde cero.","Na clave de Sol, as cinco linhas de baixo para cima são Mi–Sol–Si–Ré–Fá. Memorizar essa sequência ajuda a ler sem contar desde o início."],["Mi4, Sol4, Si4, Re5 y Fa5.","Mi4, Sol4, Si4, Ré5 e Fá5."],["¿Qué nota está en la tercera línea desde abajo?","Qual nota está na terceira linha de baixo?"],["Sol","Sol"],["Si","Si"],["La tercera línea desde abajo es Si4.","A terceira linha de baixo é Si4."],["Los cuatro espacios desde abajo son Fa–La–Do–Mi. Las notas avanzan por grados conjuntos alternando línea y espacio.","Os quatro espaços de baixo para cima são Fá–Lá–Dó–Mi. As notas avançam por graus conjuntos, alternando linha e espaço."],["Fa4, La4, Do5 y Mi5.","Fá4, Lá4, Dó5 e Mi5."],["¿Qué nota ocupa el segundo espacio desde abajo?","Qual nota ocupa o segundo espaço de baixo?"],["Mi","Mi"],["El segundo espacio desde abajo corresponde a La4.","O segundo espaço de baixo corresponde a Lá4."],["Cuando una nota sube en el pentagrama, su altura sonora sube. Cuando baja, la altura sonora baja. Cada paso a la posición inmediata siguiente avanza una nota de la escala.","Quando uma nota sobe na pauta, sua altura sonora sobe. Quando desce, a altura sonora fica mais grave. Cada passo para a posição imediatamente seguinte avança uma nota da escala."],["Mi–Fa–Sol asciende; Sol–Fa–Mi desciende.","Mi–Fá–Sol sobe; Sol–Fá–Mi desce."],["Si una nota aparece más arriba en el pentagrama, ¿qué indica?","Se uma nota aparece mais acima na pauta, o que isso indica?"],["Un sonido más agudo","Um som mais agudo"],["Un sonido más grave","Um som mais grave"],["Una nota más larga","Uma nota mais longa"],["La posición más alta representa una altura sonora más aguda.","A posição mais alta representa uma altura sonora mais aguda."],["Cuando una nota queda fuera del pentagrama, se agregan pequeñas líneas llamadas líneas adicionales. No se cambia la lógica de alternar líneas y espacios.","Quando uma nota fica fora da pauta, são acrescentadas pequenas linhas chamadas linhas suplementares. A lógica de alternar linhas e espaços continua a mesma."],["Do4 suele escribirse en una línea adicional debajo del pentagrama en clave de Sol.","Dó4 geralmente é escrito em uma linha suplementar abaixo da pauta na clave de Sol."],["¿Para qué sirven las líneas adicionales?","Para que servem as linhas suplementares?"],["Para indicar silencios","Para indicar pausas"],["Para escribir notas fuera del pentagrama","Para escrever notas fora da pauta"],["Para cambiar el compás","Para mudar o compasso"],["Las líneas adicionales permiten escribir notas más agudas o graves que el pentagrama principal.","As linhas suplementares permitem escrever notas mais agudas ou mais graves do que a pauta principal."],["Do central (Do4) es una referencia para conectar el pentagrama con el piano. En el teclado de 88 teclas suele estar cerca del centro; en el dibujo aparece con una línea adicional debajo de la clave de Sol.","O Dó central (Dó4) é uma referência para conectar a pauta ao piano. Em um teclado de 88 teclas, costuma ficar perto do centro; no desenho aparece com uma linha suplementar abaixo da clave de Sol."],["Do4 corresponde a MIDI 60 y está inmediatamente a la izquierda del grupo de dos teclas negras de esa octava.","Dó4 corresponde ao MIDI 60 e fica imediatamente à esquerda do grupo de duas teclas pretas dessa oitava."],["¿Qué nota se usa como referencia para conectar el pentagrama con el centro del piano?","Qual nota é usada como referência para conectar a pauta ao centro do piano?"],["Do central","Dó central"],["Sol5","Sol5"],["La3","Lá3"],["Do central (Do4) es una referencia fundamental para ubicar la lectura en el teclado.","Dó central (Dó4) é uma referência fundamental para localizar a leitura no teclado."],["Después de siete nombres de nota, la secuencia vuelve a Do en otra octava. El nombre se repite, pero la frecuencia se duplica al subir una octava.","Depois de sete nomes de notas, a sequência volta a Dó em outra oitava. O nome se repete, mas a frequência dobra ao subir uma oitava."],["Do4–Re4–…–Si4–Do5.","Dó4–Ré4–…–Si4–Dó5."],["¿Qué sucede al subir una octava?","O que acontece ao subir uma oitava?"],["Se repite el nombre en una altura más aguda","O nome se repete em uma altura mais aguda"],["La nota dura el doble","A nota dura o dobro"],["La nota baja un semitono","A nota desce um semitom"],["La octava repite el nombre de la nota en un registro más agudo.","A oitava repete o nome da nota em um registro mais agudo."],["Las figuras indican cuánto dura un sonido en relación con el pulso. En una referencia habitual de 4/4: redonda = 4 pulsos, blanca = 2 y negra = 1.","As figuras indicam quanto tempo um som dura em relação à pulsação. Em uma referência habitual de 4/4: semibreve = 4 pulsos, mínima = 2 e semínima = 1."],["Una redonda equivale a dos blancas o cuatro negras.","Uma semibreve equivale a duas mínimas ou quatro semínimas."],["En 4/4, ¿cuántos pulsos dura una negra?","Em 4/4, quantos pulsos dura uma semínima?"],["Uno","Um"],["Dos","Dois"],["Cuatro","Quatro"],["En el ejemplo de 4/4, la negra dura un pulso.","No exemplo de 4/4, a semínima dura um pulso."],["Dos corcheas ocupan el mismo tiempo que una negra. Se suelen contar como “1 y” dentro de un pulso subdividido en dos partes iguales.","Duas colcheias ocupam o mesmo tempo que uma semínima. Costumam ser contadas como “1 e” dentro de um pulso dividido em duas partes iguais."],["Una negra puede dividirse en dos corcheas: ta–ta dentro de un pulso.","Uma semínima pode ser dividida em duas colcheias: ta–ta dentro de um pulso."],["¿Cuántas corcheas equivalen a una negra?","Quantas colcheias equivalem a uma semínima?"],["Una","Uma"],["Dos","Duas"],["Cuatro","Quatro"],["Dos corcheas equivalen a una negra.","Duas colcheias equivalem a uma semínima."],["Cada figura tiene un silencio equivalente. El silencio no es una nota suave: indica que no se debe producir sonido durante esa duración.","Cada figura tem uma pausa equivalente. A pausa não é uma nota suave: indica que nenhum som deve ser produzido durante aquela duração."],["Un silencio de negra ocupa un pulso en 4/4.","Uma pausa de semínima ocupa um pulso em 4/4."],["¿Qué indica un silencio de negra?","O que indica uma pausa de semínima?"],["Un sonido muy suave","Um som muito suave"],["No tocar durante un pulso","Não tocar durante um pulso"],["Tocar dos notas juntas","Tocar duas notas juntas"],["El silencio de negra indica un pulso sin sonido.","A pausa de semínima indica um pulso sem som."],["El compás organiza los pulsos en grupos. En 4/4 hay cuatro pulsos por compás y la negra es la unidad de pulso indicada por el denominador.","O compasso organiza as pulsações em grupos. Em 4/4 há quatro pulsos por compasso e a semínima é a unidade de pulsação indicada pelo denominador."],["Contá 1–2–3–4 y repetí el patrón al comenzar el siguiente compás.","Conte 1–2–3–4 e repita o padrão ao começar o compasso seguinte."],["¿Cuántos pulsos de negra hay en un compás de 4/4?","Quantos pulsos de semínima há em um compasso de 4/4?"],["El numerador 4 indica cuatro pulsos por compás; el denominador 4 señala la negra como unidad.","O numerador 4 indica quatro pulsos por compasso; o denominador 4 indica a semínima como unidade."],["La barra de compás es una línea vertical que separa un compás del siguiente. Ayuda a organizar la lectura y a ubicar los tiempos fuertes.","A barra de compasso é uma linha vertical que separa um compasso do seguinte. Ajuda a organizar a leitura e localizar os tempos fortes."],["En 4/4, después de contar cuatro pulsos se llega a la barra de compás.","Em 4/4, depois de contar quatro pulsos chega-se à barra de compasso."],["¿Qué separa una barra de compás?","O que uma barra de compasso separa?"],["Dos notas iguales","Duas notas iguais"],["Un compás del siguiente","Um compasso do seguinte"],["La clave de Sol de la clave de Fa","A clave de Sol da clave de Fá"],["La barra de compás delimita el final de un compás y el comienzo del siguiente.","A barra de compasso delimita o fim de um compasso e o início do seguinte."],["Un sostenido eleva la nota un semitono y un bemol la baja un semitono. El símbolo se coloca antes de la nota en la escritura musical.","Um sustenido eleva a nota em um semitom e um bemol a abaixa em um semitom. O símbolo é colocado antes da nota na escrita musical."],["Fa♯ se toca un semitono por encima de Fa; Si♭, un semitono por debajo de Si.","Fá♯ é tocado um semitom acima de Fá; Si♭, um semitom abaixo de Si."],["¿Qué indica el símbolo ♯?","O que indica o símbolo ♯?"],["Subir un semitono","Subir um semitom"],["Bajar un semitono","Descer um semitom"],["Duplicar la duración","Dobrar a duração"],["El sostenido eleva la nota un semitono.","O sustenido eleva a nota em um semitom."],["La armadura aparece junto a la clave y señala alteraciones que se aplican durante la pieza. Una alteración accidental aparece antes de una nota y modifica su altura según las reglas del compás.","A armadura aparece junto à clave e indica alterações que se aplicam durante a peça. Um acidente aparece antes de uma nota e modifica sua altura conforme as regras do compasso."],["Una armadura con Fa♯ indica que los Fa se tocan sostenidos, salvo que un becuadro lo cancele.","Uma armadura com function pianoTranslateText(text){
 if(pianoLanguage!=='pt')return text;
 let out=String(text);
 for(const pair of pianoPT){if(!Array.isArray(pair)||pair.length<2)continue;const es=String(pair[0]),pt=String(pair[1]);out=out.split(es).join(pt)}
 // "La" pode ser artigo ou nome de nota: protegemos a nota em sequências musicais e com indicação de oitava.
 out=out.replace(/^\s*Re\s*$/,'__PITCH_NOTE_D__');
 out=out.replace(/Re(?=\d)/g,'__PITCH_NOTE_D__');
 out=out.replace(/Re(?=[♯♭♮])/g,'__PITCH_NOTE_D__');
 out=out.replace(/Re(?=[–,·]\s*(?:Do|Mi|Fa|Sol|La|Si)\b)/g,'__PITCH_NOTE_D__');
 out=out.replace(/^\s*Fa\s*$/,'__PITCH_NOTE_F__');
 out=out.replace(/Fa(?=\d)/g,'__PITCH_NOTE_F__');
 out=out.replace(/Fa(?=[♯♭♮])/g,'__PITCH_NOTE_F__');
 out=out.replace(/Fa(?=[–,·]\s*(?:Si|Do|Re|Mi|Sol|La)\b)/g,'__PITCH_NOTE_F__');
 out=out.replace(/^\s*Do\s*$/,'__PITCH_NOTE_C__');
 out=out.replace(/Do(?=\d)/g,'__PITCH_NOTE_C__');
 out=out.replace(/Do(?=[–,·]\s*(?:Si|Re|Mi|Fa|Sol|La)\b)/g,'__PITCH_NOTE_C__');
 out=out.replace(/La(?=\d)/g,'__PITCH_NOTE_17__');
 out=out.replace(/La(?=[–,·]\s*(?:Si|Do|Re|Mi|Fa|Sol)\b)/g,'__PITCH_NOTE_17__');
 for(const pair of THEORY_PT_TERMS){
  const es=pair[0].replace(/[.*+?^$()|[\]\\]/g,'\\$&');
  out=out.replace(new RegExp('(^|[^\\p{L}])'+es+'(?=$|[^\\p{L}])','giu'),(m,prefix)=>{const replacement=m.slice(prefix.length),translated=pair[1],value=replacement&&replacement===replacement.toUpperCase()?translated.toUpperCase():replacement&&replacement[0]===replacement[0].toUpperCase()?translated[0].toUpperCase()+translated.slice(1):translated;return prefix+value});
 }
 return out.replace(/__PITCH_NOTE_17__/g,'Lá').replace(/__PITCH_NOTE_C__/g,'Dó').replace(/__PITCH_NOTE_F__/g,'Fá').replace(/__PITCH_NOTE_D__/g,'Ré').replace(/Répertório/g,'Repertório');
}

function registerSurgeryNote(n){if(!surgeryActive)return;const idx=surgeryInput.length;if(idx>=surgeryExpected.length)return;const expected=surgeryExpected[idx];surgeryInput.push(n);surgeryTimes.push(performance.now());if(n!==expected){surgeryActive=false;state.god.practice.errors=(state.god.practice.errors||0)+1;state.god.practice.lastScore=Math.round(((idx)/surgeryExpected.length)*100);state.god.practice.lastMessage='❌ Error en la nota '+(idx+1)+'. Esperada '+pitchClassName(expected)+', recibida '+pitchClassName(n)+'. Bajá 5 BPM y repetí el mismo bloque.';state.god.practice.tempo=Math.max(40,state.god.practice.tempo-5);diagnose('note','Modo cirugía: error en el bloque de '+surgeryPiece().title,'autonomy');saveState();openGodFeature('01');if(state.god.practice.loop)surgeryLoopTimer=setTimeout(()=>{surgeryLoopTimer=null;if(state.god.practice.loop)startSurgeryRound()},700);return}if(surgeryInput.length===surgeryExpected.length){surgeryActive=false;const beat=60000/state.god.practice.tempo;const intervals=surgeryTimes.slice(1).map((t,i)=>t-surgeryTimes[i]);const rhythmOk=intervals.every(x=>Math.abs(x-beat)<=Math.max(220,beat*.35));const score=Math.round(((surgeryExpected.length/surgeryExpected.length)*70)+(rhythmOk?30:Math.max(0,30-intervals.reduce((a,x)=>a+Math.min(30,Math.abs(x-beat)/beat*30),0))));state.god.practice.rounds=(state.god.practice.rounds||0)+1;state.god.practice.lastScore=Math.max(0,Math.min(100,score));if(score>=90){state.god.practice.clean=(state.god.practice.clean||0)+1;state.god.practice.lastMessage='✓ Bloque limpio ('+score+'%). '+(state.god.practice.clean>=3?'Dominado: podés subir 5 BPM.':'Buscá otra repetición limpia.');if(state.god.practice.clean>=3){state.god.practice.tempo=Math.min(180,state.god.practice.tempo+5);state.god.practice.clean=0;}}else{state.god.practice.errors=(state.god.practice.errors||0)+1;state.god.practice.lastMessage='⚠️ Notas correctas, pero el pulso todavía no está estable ('+score+'%). Repetí al mismo tempo.';diagnose('rhy function godSight(){const s=state.god.sight;const score=s.score||0;const e=prsExcerpt||prsChooseExcerpt();const status=prsActive?`<b>Prueba activa:</b> tocá las ${prsExpected.length} notas siguiendo la partitura. No mires nombres de notas.`:'Último resultado: ${s.score}/100 en ${s.history.at(-1)?.level||"este nivel"}. Elegí “Nueva prueba” para otro extracto.';return `<div class="card"><div class="pill">MOTOR 02 · PRS</div><h2>Piano Reading Score</h2><p class="muted">Evaluación real de lectura a primera vista: precisión de notas, continuidad y estabilidad rítmica. No hay resultados aleatorios.</p><div class="scorebig">${score||'—'}<span class="muted" style="font-size:15px"> / 100</span></div><div class="barline"><span>Último nivel</span><div class="meter"><i style="width:${Math.max(0,score)}%"></i></div><b>${score? (s.history.at(-1)?.level||'—'):'—'}</b></div><div class="note-box"><b>Extracto ${e.level} · ♩ ${e.tempo}</b>${prsStaff(e.notes)}<p class="muted">${status}</p><div id="prsCount" class="target" style="font-size:24px">${prsInput.length} / ${e.notes.length}</div></div><div class="row-controls"><button class="btn primary" onclick="startSightTest()">▶ ${prsActive?'Reiniciar prueba':'Nueva prueba'}</button><button class="btn" onclick="finishSightTest()" ${prsActive?'':'disabled'}>✓ Finalizar</button><span class="muted">Intentos: ${s.attempts||0}</span></div>${s.history.length?'<div class="note-box"><b>Historial PRS</b>'+s.history.slice(-8).reverse().map(h=>`<div>${h.score}/100 · ${h.level} · ${h.notesOk}/${h.total} notas · ${h.rhythm}% ritmo · ${h.at}</div>`).join('')+'</div>':''}</div>${keyboard()}`}

function registerPRSNote(n){if(!prsActive)return;const now=performance.now();if(!prsStart)prsStart=now;const i=prsInput.length;if(i>=prsExpected.length)return;prsInput.push(n);prsTimes.push(now);if(prsInput.length===prsExpected.length)finishSightTest();else{const c=document.getElementById('prsCount');if(c)c.textContent=prsInput.length+' / '+prsExpected.length;}}
function finishSightTest(){if(!prsActive||!prsExpected.length)return;prsActive=false;const total=prsExpected.length;let correct=0;for(let i=0;i<Math.min(prsInput.length,total);i++)if(prsInput[i]===prsExpected[i])correct++;const noteScore=Math.round(correct/total*60);const beat=60000/prsExcerpt.tempo;const ints=prsTimes.slice(1).map((t,i)=>t-prsTimes[i]);const rhythmErr=ints.length?ints.reduce((a,x)=>a+Math.min(1.5,Math.abs(x-beat)/beat),0)/ints.length:1.5;const rhythmScore=Math.round(Math.max(0,25*(1-rhythmErr)));const continuity=Math.round(prsInput.length===total?15:15*(prsInput.length/total));const score=Math.max(0,Math.min(100,noteScore+rhythmScore+continuity));const s=state.god.sight;s.score=score;s.attempts=(s.attempts||0)+1;s.history.push({score,level:prsExcerpt.level,notesOk:correct,total,rhythm:rhythmScore===25?100:Math.round(rhythmScore/25*100),at:new Date().toLocaleDateString('es-AR')});s.history=s.history.slice(-30);if(correct<total)diagnose('note','PRS: precisión de lectura por debajo del objetivo.','right');if(rhythmScore<18)diagnose('rhythm','PRS: lectura correcta, pero con pulso inestable.','rhythm');award(score>=80?10:5,'right',score>=80?1:0.5);saveState();openGodFeature('02');toast('🎼 PRS: '+score+'/100 · '+correct+'/'+total+' notas correctas')}
function godPerformance(){const p=state.god.performance||{},sessions=p.sessions||[],has=sessions.length>0,pct=v=>Number.isFinite(Number(v))?Math.round(Number(v)):'—';return `<div class="card"><div class="pill">MOTOR 03 · PERFORMANCE ENGINE</div><h2>¿Cómo tocaste, no solo qué tocaste?</h2><p class="muted">Medición basada en eventos MIDI recibidos. El timing mide regularidad entre ataques, no desviación frente a un metrónomo; la duración solo evalúa notas que llegaron a cerrarse.</p><div class="godgrid"><div class="note-box"><b>Calidad global</b><div class="scorebig">${has?pct(p.score):'—'}</div><span class="muted">/100 · última medición</span></div><div class="note-box"><b>Dinámica</b><div class="scorebig">${has?pct(p.velocityConsistency):'—'}</div><span class="muted">uniformidad de fuerza</span></div><div class="note-box"><b>Timing</b><div class="scorebig">${has?pct(p.timingConsistency):'—'}</div><span class="muted">regularidad entre ataques</span></div><div class="note-box"><b>Duración</b><div class="scorebig">${has?pct(p.durationConsistency):'—'}</div><span class="muted">uniformidad de duración</span></div></div><div class="two"><div class="note-box"><b>Rango dinámico</b><p class="muted">${has?(p.dynamicsRange||0):'—'} niveles MIDI · balance estimado ${has?pct(p.balance)+'%':'—'}</p></div><div class="note-box"><b>Acordes / pedal</b><p class="muted">Simultaneidad de ataques: ${has&&p.chordTightness!==null?pct(p.chordTightness)+'%':'Sin acordes medidos'} · Pedal ${has?(p.pedal?'detectado en el último evento':'no detectado en el último evento'):'—'}</p></div></div><p class="muted">Para medir: conectá un teclado/controlador MIDI, tocá una frase variada (incluí acordes si querés medir simultaneidad) y elegí Analizar. El micrófono y las teclas en pantalla no generan una medición MIDI real.</p><button class="btn primary" onclick="analyzePerformance()">Analizar ejecución real</button> <button class="btn" onclick="resetMidiTelemetry();openGodFeature('03')">Nueva medición</button><div class="note-box" style="margin-top:12px"><b>Últimas mediciones</b><p class="muted">${sessions.slice(-5).reverse().map(x=>`${x.date} · ${x.score}/100 · dinámica ${x.velocityConsistency}% · timing ${x.timingConsistency}% · ${x.notes||0} ataques`).join('<br>')||'Todavía no hay mediciones.'}</p></div></div>`}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function stdev(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))}
function analyzePerformance(){const t=midiTelemetry,ons=(t.eventsOn||[]).slice().sort((a,b)=>a.time-b.time),offs=t.eventsOff||[];if(ons.length<3){toast('Tocá al menos 3 notas por MIDI y volvé a analizar.');return}const velocities=ons.map(x=>x.velocity).filter(Number.isFinite),durationEvents=offs.filter(x=>x.duration>10&&x.duration<10000),durations=durationEvents.map(x=>x.duration),intervals=[];for(let i=1;i<ons.length;i++){const d=ons[i].time-ons[i-1].time;if(d>0&&d<10000)intervals.push(d)}const cv=a=>stdev(a)/(mean(a)||1),intervalCV=cv(intervals),velCV=cv(velocities),durCV=durations.length>=2?cv(durations):null;const timingConsistency=intervals.length>=2?Math.max(0,Math.min(100,100-intervalCV*120)):null,velocityConsistency=velocities.length>=2?Math.max(0,Math.min(100,100-velCV*100)):null,durationConsistency=durations.length>=2?Math.max(0,Math.min(100,100-durCV*100)):null,dynamicsRange=velocities.length?Math.max(...velocities)-Math.min(...velocities):0;const groups=[];for(const e of ons){let g=groups[groups.length-1];if(!g||e.time-g.events[g.events.length-1].time>45){g={events:[]};groups.push(g)}g.events.push(e)}const chords=groups.filter(g=>g.events.length>=2);const chordSpreads=chords.map(g=>Math.max(...g.events.map(e=>e.time))-Math.min(...g.events.map(e=>e.time)));const chordTightness=chordSpreads.length?Math.max(0,Math.min(100,100-mean(chordSpreads)*1.5)):null;const lows=ons.filter(x=>x.note<60).map(x=>x.velocity),highs=ons.filter(x=>x.note>=60).map(x=>x.velocity),balance=lows.length&&highs.length?Math.max(0,Math.min(100,50+(mean(highs)-mean(lows))*.5)):50;const components=[];if(velocityConsistency!==null)components.push([velocityConsistency,.25]);if(durationConsistency!==null)components.push([durationConsistency,.2]);if(timingConsistency!==null)components.push([timingConsistency,.35]);if(chordTightness!==null)components.push([chordTightness,.1]);if(dynamicsRange>0)components.push([Math.min(100,dynamicsRange/70*100),.1]);const weight=components.reduce((a,x)=>a+x[1],0),score=weight?Math.round(components.reduce((a,x)=>a+x[0]*x[1],0)/weight):0;const previous=state.god.performance||{};state.god.performance=Object.assign({},previous,{velocity:Math.round(mean(velocities)),duration:durations.length?Math.round(mean(durations)):0,timing:timingConsistency===null?0:Math.round(timingConsistency),pedal:t.pedal,velocityConsistency:velocityConsistency===null?0:Math.round(velocityConsistency),durationConsistency:durationConsistency===null?0:Math.round(durationConsistency),timingConsistency:timingConsistency===null?0:Math.round(timingConsistency),chordTightness:chordTightness===null?null:Math.round(chordTightness),dynamicsRange,balance:Math.round(balance),score,sessions:[...(previous.sessions||[]),{date:new Date().toLocaleString('es-AR'),score,velocityConsistency:velocityConsistency===null?'—':Math.round(velocityConsistency),timingConsistency:timingConsistency===null?'—':Math.round(timingConsistency),notes:ons.length,durationNotes:durations.length,chords:chords.length}].slice(-30)});state.diagnostics.counts=state.diagnostics.counts||{};state.diagnostics.counts.performance=(state.diagnostics.counts.performance||0)+1;saveState();toast('✓ MIDI analizado: '+score+'/100 · '+ons.length+' ataques · '+chords.length+' acordes detectados');openGodFeature('03')}
